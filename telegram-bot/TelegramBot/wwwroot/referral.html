<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>GROUPCHAT — Referral overview</title>
<link rel="icon" type="image/png" href="/groupchat-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
    :root {
        --bg: #0a0e13;
        --surface: #10161d;
        --surface-2: #161d26;
        --border: #202a35;
        --text: #e9eef4;
        --text-dim: #7c8aa0;
        --text-faint: #4d5a6e;
        --accent: #e8ac3f;
        --good: #38c98f;
        --radius: 10px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; line-height: 1.45; }
    .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }

    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 24px; border-bottom: 1px solid var(--border); background: rgba(10,14,19,0.92); backdrop-filter: blur(8px); position: sticky; top: 0; z-index: 5; }
    .brand { display: flex; align-items: center; gap: 9px; }
    .brand img { width: 26px; height: 26px; border-radius: 6px; display: block; }
    .brand b { font-weight: 700; font-size: 15px; letter-spacing: -.01em; }
    .live { display: flex; align-items: center; gap: 7px; color: var(--text-dim); font-size: 12px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 3px rgba(56,201,143,.15); }

    .wrap { max-width: 880px; margin: 0 auto; padding: 36px 20px 64px; }
    .eyebrow { color: var(--text-dim); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; }
    h1 { font-size: 30px; font-weight: 800; letter-spacing: -.02em; margin: 6px 0 26px; }

    .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 14px; }
    .tile { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; }
    .tile .k { color: var(--text-dim); font-size: 12px; font-weight: 600; letter-spacing: .04em; }
    .tile .v { font-size: 36px; font-weight: 700; margin-top: 6px; letter-spacing: -.02em; font-family: 'Manrope', sans-serif; font-variant-numeric: tabular-nums; }
    .tile .s { color: var(--text-faint); font-size: 12px; margin-top: 2px; }
    .tile.a .v { color: var(--accent); }
    .tile.g .v { color: var(--good); }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; margin-top: 12px; }
    .card h2 { font-size: 13px; font-weight: 700; letter-spacing: .02em; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .legend { display: flex; gap: 14px; color: var(--text-dim); font-size: 12px; font-weight: 500; }
    .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

    #chart { width: 100%; height: 190px; display: block; }
    #chart text { fill: var(--text-faint); font-size: 10px; font-family: 'IBM Plex Mono', monospace; }

    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: right; padding: 10px 6px; border-bottom: 1px solid var(--border); font-size: 13px; }
    th:first-child, td:first-child { text-align: left; }
    th { color: var(--text-dim); font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
    tr:last-child td { border-bottom: 0; }

    .note { color: var(--text-faint); font-size: 12px; margin-top: 22px; text-align: center; }
    .err { text-align: center; padding: 90px 20px; color: var(--text-dim); }
    .err h1 { margin: 0 0 8px; font-size: 22px; color: var(--text); }
    @media (max-width: 640px) {
        .tiles { grid-template-columns: 1fr; }
        .wrap { padding-top: 26px; }
        h1 { font-size: 24px; }
    }
</style>
</head>
<body>
<div class="topbar">
    <div class="brand"><img src="/groupchat-logo.png" alt=""><b>GROUPCHAT</b></div>
    <div class="live" id="live" style="visibility:hidden"><span class="dot"></span><span id="updated">Live</span></div>
</div>

<div class="wrap" id="app">
    <div class="eyebrow">Referral overview</div>
    <h1 id="title">&nbsp;</h1>
    <div id="body"></div>
</div>

<script>
(function () {
    var token = location.pathname.split('/').filter(Boolean).pop() || '';
    var body = document.getElementById('body');
    var fmt = function (n) { return Number(n).toLocaleString('en-US'); };

    function fail() {
        document.getElementById('app').innerHTML = '<div class="err"><h1>This link isn\'t valid</h1><p>Check that you copied the whole address.</p></div>';
    }

    function chart(days) {
        var W = 840, H = 190, padL = 28, padB = 22, padT = 8;
        var max = Math.max(1, Math.max.apply(null, days.map(function (d) { return Math.max(d.signups, d.subscribed); })));
        var step = max <= 5 ? 1 : Math.ceil(max / 4);
        var top = Math.ceil(max / step) * step;
        var gw = (W - padL) / days.length, bw = Math.max(3, gw * 0.32);
        var y = function (v) { return padT + (H - padT - padB) * (1 - v / top); };
        var s = '<svg id="chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" aria-label="Daily joins and subscriptions, last 30 days">';
        for (var t = 0; t <= top; t += step) {
            s += '<line x1="' + padL + '" x2="' + W + '" y1="' + y(t) + '" y2="' + y(t) + '" stroke="#202a35" stroke-width="1"/>';
            s += '<text x="' + (padL - 6) + '" y="' + (y(t) + 3) + '" text-anchor="end">' + t + '</text>';
        }
        days.forEach(function (d, i) {
            var x = padL + i * gw + gw / 2;
            var tip = '<title>' + d.day + ': ' + d.signups + ' joined, ' + d.subscribed + ' subscribed</title>';
            s += '<g>' + tip;
            s += '<rect x="' + (x - bw - 1) + '" y="' + y(d.signups) + '" width="' + bw + '" height="' + Math.max(0, (H - padB) - y(d.signups)) + '" rx="1.5" fill="#e8ac3f"/>';
            s += '<rect x="' + (x + 1) + '" y="' + y(d.subscribed) + '" width="' + bw + '" height="' + Math.max(0, (H - padB) - y(d.subscribed)) + '" rx="1.5" fill="#38c98f"/>';
            s += '</g>';
            if (i % 5 === 0 || i === days.length - 1) s += '<text x="' + (i === days.length - 1 ? W - 2 : x) + '" y="' + (H - 6) + '" text-anchor="' + (i === days.length - 1 ? 'end' : 'middle') + '">' + d.day.slice(5) + '</text>';
        });
        return s + '</svg>';
    }

    function render(d) {
        document.getElementById('title').textContent = d.label;
        document.title = 'GROUPCHAT — ' + d.label;
        var conv = d.signups ? Math.round(1000 * d.subscribed / d.signups) / 10 : 0;
        var rows = d.months.slice().reverse().map(function (m) {
            return '<tr><td class="mono">' + m.day + '</td><td class="mono">' + fmt(m.signups) + '</td><td class="mono">' + fmt(m.subscribed) + '</td></tr>';
        }).join('');
        body.innerHTML =
            '<div class="tiles">' +
              '<div class="tile a"><div class="k">JOINED</div><div class="v mono">' + fmt(d.signups) + '</div><div class="s">people who started the bot through your link</div></div>' +
              '<div class="tile g"><div class="k">SUBSCRIBED</div><div class="v mono">' + fmt(d.subscribed) + '</div><div class="s">of those, people who have subscribed</div></div>' +
              '<div class="tile"><div class="k">CONVERSION</div><div class="v mono">' + conv + '%</div><div class="s">subscribed of joined</div></div>' +
            '</div>' +
            '<div class="card"><h2>Last 30 days<span class="legend"><span><i style="background:#e8ac3f"></i>Joined</span><span><i style="background:#38c98f"></i>Subscribed</span></span></h2>' + chart(d.days) + '</div>' +
            '<div class="card"><h2>By month</h2><table><thead><tr><th>Month</th><th>Joined</th><th>Subscribed</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
            '<p class="note">Totals only. A person counts as subscribed from their first payment.</p>';
        document.getElementById('live').style.visibility = 'visible';
        document.getElementById('updated').textContent = 'Updated ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function load() {
        fetch('/api/referral/' + encodeURIComponent(token), { cache: 'no-store', referrerPolicy: 'no-referrer' })
            .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
            .then(render)
            .catch(function (e) { if (!body.innerHTML) fail(); });
    }
    load();
    setInterval(load, 60000);
})();
</script>
</body>
</html>

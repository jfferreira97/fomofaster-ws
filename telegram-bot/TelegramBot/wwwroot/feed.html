<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>/* iPhone / iPad: no zoom-in when a small input or select gets focus (iOS still lets the reader pinch-zoom) */ if (/iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) { const m = document.querySelector('meta[name=viewport]'); m.content += ', maximum-scale=1'; }</script>
<title>GROUPCHAT Feed</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/groupchat-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Flat tracker look: dense rows tinted by their side, a coloured stripe on the left, tabs on top, a table on desktop. */
:root{
  color-scheme:dark;   /* native bits (the terminal picker's list, number spinners) follow the dark page */
  --bg:#090b0f;--p:#0f1218;--p2:#141821;--line:#161b25;--tx:#e8ebf1;--mu:#808a9c;--fa:#586377;
  --buy:#2fd38a;--sell:#f0506e;--call:#e9ab43;--the:#5aa2ff;--fire:#f2c14e;--rep:#a98bf5;--lock:#4fd1e8;
  --s1:var(--p);--s2:var(--p2);--s3:#1c2530;--line2:#2a3243;--accent:var(--call);--accent-dim:#6b551f;--accent-soft:#e9ab431f;--r:7px;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:500 14px/1.4 var(--sans);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ---------- top bar ---------- */
.top{flex:none;display:flex;align-items:center;gap:10px;min-height:48px;padding:10px 14px 8px;background:var(--bg);border-bottom:1px solid var(--line)}
/* The nav both pages share (Feed | Manage): same markup and the same rules in manage.html. */
.gc-nav{display:flex;align-items:center;gap:2px;padding:2px;flex:none;background:#0f1218;border:1px solid #161b25;border-radius:8px}
.gc-nav a{display:flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:6px;font:600 12.5px 'Manrope',system-ui,sans-serif;color:#808a9c;text-decoration:none;white-space:nowrap;transition:color .12s,background-color .12s}
.gc-nav a:hover{color:#e8ebf1}
.gc-nav a.on{color:#e8ebf1;background:#1a1f29;box-shadow:inset 0 0 0 1px #2a3243}
.gc-nav svg{width:14px;height:14px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.gc-nav a.on svg{color:#e9ab43}
@media(max-width:619px){.gc-nav a{padding:0 8px}.gc-nav a>span:not(.dot){display:none}}
.gc-nav a{position:relative}
.gc-nav .dot{position:absolute;top:4px;left:19px;width:6px;height:6px;border:1px solid #0f1218;box-sizing:content-box}   /* the live dot sits on the Feed icon's corner, so both pages' navs are the same width */
.gc-nav .dot.live{box-shadow:0 0 0 2px rgba(47,211,138,.18)}
@media(max-width:619px){.gc-nav .dot{left:17px}}
@media(max-width:759px){.brand span,.openin>span{display:none}}
@media(max-width:799px){.openin>span{display:none}}   /* room for the plan badge */
@media(max-width:679px){.top{gap:8px}}
@media(max-width:459px){.tier{display:none}}   /* a phone: the bar keeps to the tools (/manage, with fewer buttons, still shows it) */
/* The plan sits right after the nav on both pages (/manage too), worded the same: in full where there is room ("Full access ·
   17 days left"), short on a narrower bar ("17d left"). */
.tier .pl-s{display:none}
@media(max-width:919px){.tier .pl-l{display:none}.tier .pl-s{display:inline}}
.brand,.brand img{flex:none}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;letter-spacing:-.01em;min-width:0}
.brand img{width:24px;height:24px;border-radius:6px}
.sp{flex:1}
.dot{width:7px;height:7px;border-radius:50%;background:var(--fa);flex:none}
.dot.live{background:var(--buy);box-shadow:0 0 0 3px rgba(47,211,138,.15)}
.dot.retry{background:var(--call)}
.tier{flex:none;white-space:nowrap;font:700 10px var(--mono);letter-spacing:.08em;padding:3px 7px;border-radius:5px;text-transform:uppercase;border:1px solid var(--line);color:var(--mu)}
.tier.full{color:var(--buy);border-color:rgba(47,211,138,.35);background:rgba(47,211,138,.08)}
.tier.free,.tier.soon{color:var(--call);border-color:rgba(233,171,67,.35);background:rgba(233,171,67,.08)}
.tier.none{color:var(--sell);border-color:rgba(240,80,110,.35);background:rgba(240,80,110,.08)}
a.tier{text-decoration:none} a.tier:hover{filter:brightness(1.2)}
.mlink{font:500 12.5px var(--sans);color:var(--mu);text-decoration:none;padding:6px 12px;border-radius:var(--r);border:1px solid var(--line);transition:border-color .12s,color .12s}
.mlink:hover{border-color:var(--mu);color:var(--tx)}
.ibtn{width:30px;height:30px;border-radius:var(--r);display:grid;place-items:center;color:var(--mu);border:1px solid transparent;transition:border-color .12s,color .12s;flex:none}
.ibtn:hover{border-color:var(--line);color:var(--tx)}
.ibtn.on{color:var(--accent);border-color:var(--accent-dim);background:var(--accent-soft)}
.ibtn[hidden]{display:none}
.ibtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.openin{display:flex;align-items:center;gap:6px;font:500 12px var(--sans);color:var(--mu);flex:none}
/* "Open in": our own menu, so each choice can show its site's logo (a native <select> cannot) */
.openin{position:relative}
.tsel{display:flex;align-items:center;gap:7px;height:30px;padding:0 9px 0 8px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);color:var(--tx);font:600 12px var(--sans);cursor:pointer;white-space:nowrap;transition:border-color .12s}
.tsel:hover,.tsel[aria-expanded=true]{border-color:var(--line2)}
.tsel:focus-visible{outline:0;border-color:var(--accent-dim)}
.tsel svg{width:9px;height:6px;fill:var(--mu);flex:none}
.tico{width:16px;height:16px;border-radius:4px;flex:none;object-fit:cover}
.tmenu{position:absolute;top:calc(100% + 6px);right:0;z-index:60;min-width:172px;padding:4px;display:flex;flex-direction:column;background:var(--p);border:1px solid var(--line2);border-radius:8px;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.tmenu[hidden]{display:none}
.topt{display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;border-radius:6px;font:600 12.5px var(--sans);color:var(--mu);text-align:left;white-space:nowrap}
.topt:hover,.topt:focus-visible{background:var(--p2);color:var(--tx);outline:0}
.topt[aria-selected=true]{color:var(--tx)}
.topt[aria-selected=true]::after{content:'';margin-left:auto;padding-left:0;width:6px;height:6px;border-radius:50%;background:var(--accent)}
input[type=number],input.tc-mc,select{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--tx);border-radius:var(--r);padding:7px 10px;font:12px var(--mono);outline:0}
input:focus,select:focus{border-color:var(--accent-dim)}

.tabs{flex:none;display:flex;gap:2px;padding:0 10px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;appearance:none;background:none;border:0;color:var(--mu);font:600 13px var(--sans);padding:9px 10px 10px;position:relative;cursor:pointer;display:flex;gap:6px;align-items:center}
.tab .n{font:500 10.5px var(--mono);color:var(--fa)}
.tab.on{color:var(--tx)}
.tab.on::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2px;border-radius:2px;background:var(--tx)}
.tab.on .n{color:var(--mu)}

.banner{flex:none;font-size:12px;line-height:1.5;color:var(--mu);padding:8px 14px;background:var(--p);border-bottom:1px solid var(--line)}
.banner a{color:var(--call);text-decoration:none;font-weight:700}
.banner a:hover{text-decoration:underline}
.banner[hidden]{display:none}

#filters{flex:none;padding:12px 14px 14px;border-bottom:1px solid var(--line);background:var(--p);display:none;flex-direction:column;gap:12px}
#filters.open{display:flex}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lbl{font:500 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--fa);width:100%}
.chip{font:500 12px var(--sans);padding:6px 10px;border-radius:var(--r);background:var(--p2);border:1px solid transparent;color:var(--mu);transition:border-color .12s,color .12s}
.chip:hover{color:var(--tx)}
.chip.on{color:var(--accent);border-color:var(--accent-dim);background:var(--accent-soft)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two label{display:flex;flex-direction:column;gap:5px;font-size:11.5px;color:var(--mu)}
.sub{font-size:11.5px;color:var(--fa)}

.thead{display:none}

/* ---------- list ---------- */
#wrap{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;width:100%;position:relative}
#list{flex:1;min-height:0;width:100%;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;overflow-anchor:none}   /* add() keeps a scrolled reader's place itself */
#list::-webkit-scrollbar{display:none}
/* Our own thin scrollbar, laid over the rows' right padding: no arrows, no track, hidden until the reader scrolls
   (new alerts pushing the list do not show it), then fades out. It can be dragged while it shows. */
.sbar{position:absolute;top:0;right:3px;width:5px;height:40px;border-radius:5px;background:rgba(232,235,241,.2);opacity:0;pointer-events:none;touch-action:none;
  transition:opacity .45s ease,width .12s,right .12s,background-color .12s;will-change:transform,opacity}
.sbar.show{opacity:1;pointer-events:auto;transition:opacity .1s,width .12s,right .12s,background-color .12s}
.sbar.show:hover,.sbar.drag{width:7px;right:2px;background:rgba(232,235,241,.36)}
.sbar[hidden]{display:none}
/* every row carries a faint tint of its own colour, as the flat trackers do: green buys, red sells, amber calls... */
.r{--c:var(--mu);position:relative;border-bottom:1px solid var(--line);cursor:pointer;background:color-mix(in srgb,var(--c) 4.5%,transparent);box-shadow:inset 3px 0 0 var(--c)}
.r:hover{background:color-mix(in srgb,var(--c) 9%,transparent)}
.r.buy{--c:var(--buy)} .r.sell{--c:var(--sell)} .r.call{--c:var(--call)} .r.thesis{--c:var(--the)} .r.fire{--c:var(--fire)}
.r.lock{--c:var(--lock)} .r.reply{--c:var(--rep)}
.r.new{animation:in .6s ease-out}
@keyframes in{from{background:color-mix(in srgb,var(--c) 22%,transparent)}}

.coin{display:grid;place-items:center;object-fit:cover;color:#fff;background:var(--p2);font-family:var(--sans);font-weight:800}
.coin.lock{color:var(--fa);border:1px dashed var(--line2);font-weight:700}
.who{display:grid;place-items:center;object-fit:cover;border-radius:50%;color:#fff;font-family:var(--sans);font-weight:800}
.tag{flex:none;font:700 9.5px/1 var(--mono);letter-spacing:.07em;padding:3px 5px;border-radius:4px;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent);text-transform:uppercase}
.sym{font-family:var(--sans);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sym.hid{color:var(--mu);font-weight:700}
.mc{flex:none;font:500 11.5px var(--mono);color:var(--mu)}
.nm{color:var(--c);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;text-decoration:none}
a.nm:hover{text-decoration:underline}
.nm.hid{color:var(--fa);font-weight:500}
.pl{flex:none;font:700 9.5px var(--mono);letter-spacing:.06em}
.pl.pump{color:#e8a04a} .pl.fomo{color:#6ea8ff}
.ch{flex:none;font:500 10.5px var(--mono);color:var(--fa)}
.cp{flex:none;width:22px;height:22px;display:grid;place-items:center;border:1px solid var(--line);border-radius:6px;background:var(--p);color:var(--mu);cursor:pointer;padding:0}
.cp svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cp{transition:color .1s,border-color .1s,background-color .1s,transform .06s}
.cp:hover{color:var(--tx);border-color:var(--line2)}
.cp:active{transform:scale(.86)}
.cp.ok{color:var(--buy);border-color:rgba(47,211,138,.4);background:rgba(47,211,138,.1)}   /* a short tick, not a lingering state */
.valbox{position:relative}
.amt{font:700 15px/1.1 var(--mono);color:var(--c);letter-spacing:-.01em}
.amt.hid{color:var(--fa);letter-spacing:.08em;font-weight:600}
.pos{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:-1px;font:400 7px/1 var(--mono);color:var(--c);opacity:.8;white-space:nowrap}
.age{font:400 11px var(--mono);color:var(--fa)}

/* ---------- phone: two lines per row ---------- */
.mob{display:grid;grid-template-columns:42px minmax(0,1fr) auto;column-gap:11px;align-items:center;padding:11px 22px 11px 14px}
.dsk{display:none}
.tk{position:relative;width:42px;height:42px}
.tk .coin{width:42px;height:42px;border-radius:10px;font-size:16px}
.tk .who{position:absolute;right:-5px;bottom:-5px;width:19px;height:19px;border:2px solid var(--bg);font-size:9px}
.l1{display:flex;align-items:center;gap:7px;min-width:0}
.l1 .sym{font-size:15px;line-height:1.15}
/* the chain sits on the coin's line, as a small chip so it does not read as part of the market cap next to it */
.l1 .ch,.c-tk .ch{flex:none;font:600 9.5px/1 var(--mono);letter-spacing:.05em;color:var(--mu);padding:3px 5px;border:1px solid var(--line2);border-radius:4px;white-space:nowrap}   /* at most 5 letters (CH_SHORT); the ticker gives way, never the chip */
.l2{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:12px;min-width:0;white-space:nowrap}
.m{min-width:0}
.v{display:flex;flex-direction:column;align-items:flex-end;text-align:right}
.v .valbox{margin-bottom:9px}
.v .valbox + .age{margin-top:2px}
.v .age{margin-top:5px}
.txtw{grid-column:2 / 4;margin-top:8px;min-width:0}
.txt{padding-left:9px;border-left:2px solid color-mix(in srgb,var(--c) 60%,transparent);font-size:13px;line-height:1.45;color:#b8c0ce;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}

/* Calls, theses, replies and reposts are shown whole (.r.x) by default. Each folds on its own with its button (it keeps
   its place, open or folded), and the top bar's button folds or unfolds them all. A trending row opens (.r.x) into one line per trader.
   Phone: .txt.long / .txt.short. Desktop: what does not fit its cell is shown under the row (.drop). */
.txtw{display:flex;align-items:flex-start;gap:6px}   /* the fold button at the top right: open or folded, it does not move */
.tb{flex:1;min-width:0}
.ctx{font:500 11px var(--mono);color:var(--mu);margin-bottom:5px}
.txt.long,.drop .full{display:block;-webkit-line-clamp:none;line-clamp:none;overflow:visible;white-space:pre-wrap;line-height:1.5;color:#c9d0dc}
.drop .full{padding-left:9px;border-left:2px solid color-mix(in srgb,var(--c) 60%,transparent);font-size:13px;word-break:break-word}
.drop{display:none}
.r.x .txt.short,.r:not(.x) .txt.long,.r:not(.x) .tb .ctx,.r:not(.x) .tl,.r.x .tsum{display:none}
/* one row's fold / unfold button */
.tg{flex:none;width:22px;height:22px;display:none;place-items:center;border-radius:6px;border:1px solid var(--line);background:var(--p);color:var(--mu);padding:0;cursor:pointer;transition:color .1s,border-color .1s}
.tg svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
.tg:hover{color:var(--tx);border-color:var(--line2)}
.r.x .tg svg{transform:rotate(180deg)}
.r.pmore .mob .tg{display:grid}
/* a trending row, opened: one line per trader, with what they did, their size and their entry (or average entry) */
.tl{display:grid;grid-template-columns:minmax(0,max-content) max-content max-content;column-gap:16px;row-gap:4px;padding-left:9px;border-left:2px solid color-mix(in srgb,var(--c) 60%,transparent);font-size:12.5px;align-items:baseline}
.tl .tn{font-weight:600;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tl .tn::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:7px;vertical-align:1px;background:var(--fa)}
.tl .tn.b::before{background:var(--buy)} .tl .tn.s::before{background:var(--sell)} .tl .tn.p::before{background:#e8a04a}
.tl .tu{font:600 12px var(--mono);color:#c9d0dc;text-align:right}
.tl .te{font:500 11.5px var(--mono);color:var(--mu)}
/* a lock row, opened: the lock itself, one fact a line (how much, when it unlocks, when it was locked, by whom, links) */
.ld{display:grid;grid-template-columns:max-content minmax(0,1fr);column-gap:14px;row-gap:5px;padding-left:9px;border-left:2px solid color-mix(in srgb,var(--c) 60%,transparent);font-size:12.5px;line-height:1.4;align-items:baseline}
.ld .lb{font:500 10.5px var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--mu);white-space:nowrap}
.ld .lv{color:#c9d0dc;min-width:0;overflow-wrap:anywhere}
.ld .sep{color:var(--fa)}
.ld .lt{font:500 12px var(--mono);color:var(--tx)}
.ld a{color:var(--c);font-weight:600;text-decoration:none} .ld a:hover{text-decoration:underline}
.ld .lw{display:inline-flex;align-items:center;gap:7px;vertical-align:middle}
.ld .cp{width:20px;height:20px} .ld .cp svg{width:11px;height:11px}
.r:not(.x) .ld{display:none}
/* links in a call's text, and an X post's preview under it */
.lnk{color:#7db6ff;text-decoration:underline;text-decoration-color:rgba(125,182,255,.35);text-underline-offset:2px;border-radius:3px;word-break:break-all;transition:color .1s,text-decoration-color .1s,background-color .1s}
.lnk:hover{color:#b3d4ff;text-decoration-color:currentColor;background:rgba(125,182,255,.12)}
#toast{position:fixed;left:50%;bottom:18px;z-index:95;display:flex;align-items:center;gap:10px;max-width:calc(100vw - 32px);padding:7px 7px 7px 13px;border:1px solid var(--line2);border-radius:9px;background:var(--s3);color:var(--tx);font-size:12.5px;box-shadow:0 10px 28px rgba(0,0,0,.5);opacity:0;transform:translate(-50%,8px);pointer-events:none;transition:opacity .16s,transform .16s}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toast button{flex:none;padding:3px 10px;border:1px solid var(--line2);border-radius:6px;background:var(--p2);color:var(--tx);font:600 11.5px var(--sans);cursor:pointer}
#toast button:hover{border-color:#43506a}
#toast.err{border-color:rgba(240,80,110,.55)}
#toast.err span{color:#ffc2cd}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
#xpop{position:fixed;z-index:90;display:flex;flex-direction:column;filter:drop-shadow(0 14px 30px rgba(0,0,0,.55))}
.who.plat{border-radius:5px;object-fit:contain;background:none}   /* the platform's logo in the trader's place */
.tc{min-height:0;overflow:auto;overscroll-behavior:contain;padding:12px 13px;border:1px solid #2f3848;border-radius:10px;background:var(--p);color:var(--tx);font-size:12.5px;cursor:default}
.tc-h{display:flex;align-items:center;gap:10px;min-width:0}
.tc-av{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:none;display:grid;place-items:center;font-weight:800;font-size:17px;color:#fff}
.tc-who{min-width:0}
.tc-name{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-plat{display:flex;align-items:center;gap:5px;margin-top:3px;font:600 11px var(--mono);color:var(--mu)}
.tc-plat img{width:14px;height:14px;border-radius:3px;object-fit:contain}
.tc-link{flex:none;color:#7db6ff;font-weight:600;text-decoration:none;white-space:nowrap}
.tc-link:hover{text-decoration:underline}
.tc-dn{margin-top:1px;font-size:12px;color:#c9d0dc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-f{display:flex;align-items:center;gap:12px;margin-top:11px;font-size:13px;color:var(--mu)}
.tc-f b{color:var(--tx);font:600 14px var(--mono)}
.tc-f .tc-link{margin-left:auto}
/* the card's settings: the follow and the $ floor (logged in, the same ones as /manage) and the mute (this feed's own) */
#xpop.pin .tc{border-color:#43506a}
.tc-s{display:flex;flex-direction:column;gap:8px;margin-top:11px;padding-top:11px;border-top:1px solid var(--line2)}
.tc-row{display:flex;align-items:center;gap:10px;min-height:28px}
.tc-row[hidden],.tc-ask[hidden],.tc-btn[hidden],.tc-tag[hidden]{display:none}
.tc-k{flex:none;width:64px;font:500 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}
.tc-v{flex:1;min-width:0;display:flex;align-items:center;gap:7px}
.tc-st{flex:none;font-weight:600;color:var(--mu);white-space:nowrap}
.tc-st.on{color:var(--buy)}
.tc-st.msg{flex:1 1 auto;min-width:0;white-space:normal;font-weight:500;color:var(--mu)}
.tc-tag{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;padding:1px 6px;border:1px solid var(--line2);border-radius:5px;font:500 10px var(--mono);color:var(--mu);white-space:nowrap}
.tc-btn{flex:none;margin-left:auto;padding:4px 10px;border:1px solid var(--line2);border-radius:6px;background:var(--p2);color:var(--tx);font:600 11.5px var(--sans);white-space:nowrap;transition:border-color .12s,background-color .12s}
.tc-btn:hover:not(:disabled){border-color:#43506a}
.tc-btn:disabled{opacity:.55;cursor:default}
.tc-btn.go{color:var(--buy);border-color:rgba(47,211,138,.4)}
.tc-btn.go:hover:not(:disabled){background:rgba(47,211,138,.1);border-color:rgba(47,211,138,.7)}
.tc-btn.bad{color:var(--sell);border-color:rgba(240,80,110,.4)}
.tc-btn.bad:hover:not(:disabled){background:rgba(240,80,110,.1);border-color:rgba(240,80,110,.7)}
.tc-btn.solid{color:#fff;background:var(--sell);border-color:var(--sell)}
.tc-btn.solid:hover:not(:disabled){background:#d9405d;border-color:#d9405d}
.tc .tc-min,.tc .tc-mc{width:92px;flex:none;padding:5px 8px}
.tc .tc-mc::placeholder{color:var(--mu)}
.tc .tc-sel{width:auto;flex:1;min-width:0;padding:5px 8px;font:500 12px var(--sans)}
.tc-hint{font-size:11.5px;color:var(--mu);line-height:1.4}
.tc .tc-min::placeholder{color:var(--mu)}
.tc{position:relative}
.tc-x{display:none;position:absolute;top:7px;right:7px;width:24px;height:24px;place-items:center;border-radius:6px;color:var(--mu);font-size:18px;line-height:1}
.tc-x:hover{color:var(--tx);background:var(--p2)}
#xpop.pin .tc-x{display:grid}
#xpop.pin .tc-h{padding-right:24px}
@media (max-width:440px){#toast span{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}}
.tc-v .tc-hint{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-i{flex:none;width:18px;height:18px;margin-left:auto;display:grid;place-items:center;border:1px solid var(--line2);border-radius:50%;color:var(--mu);font:italic 700 11px Georgia,'Times New Roman',serif;line-height:1;transition:border-color .12s,color .12s,background-color .12s}
.tc-i:hover,.tc-i.on{color:var(--tx);border-color:#43506a;background:var(--p2)}
.tc-info{padding:9px 11px;border:1px solid var(--line2);border-radius:8px;background:var(--p2);font-size:12px;line-height:1.45;color:#c9d0dc}
.tc-info b{display:block;margin-bottom:3px;color:var(--tx);font-weight:700}
.tc-info[hidden]{display:none}
.tc-ask{padding:10px 11px;border:1px solid rgba(240,80,110,.35);border-radius:8px;background:rgba(240,80,110,.06);font-size:12.5px;line-height:1.45;color:#c9d0dc}
.tc-ask b{color:var(--tx);font-weight:700}
.tc-acts{display:flex;justify-content:flex-end;gap:6px;margin-top:9px}
.tc-acts .tc-btn{margin-left:0}
.tc-more{align-self:flex-start;font-size:11.5px;font-weight:600;color:#7db6ff;text-decoration:none}
.tc-more:hover{text-decoration:underline}
#xpop[hidden]{display:none}
.xc{display:block;min-height:0;overflow:auto;overscroll-behavior:contain;padding:11px 13px;border:1px solid #2f3848;border-radius:10px;background:var(--p);color:inherit;text-decoration:none;white-space:normal;cursor:pointer;transition:border-color .12s}
.xc:hover{border-color:#43506a}
.xc .xl{font-size:12px;color:var(--fa)}
.xc .xh{display:flex;align-items:center;gap:7px;font-size:12.5px;min-width:0}
.xc .xh img{width:22px;height:22px;border-radius:50%;flex:none}
.xc .xn{font-weight:700;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.xc .xu{color:var(--mu);white-space:nowrap}
.xc .xt{margin-left:auto;padding-left:8px;font:500 11px var(--mono);color:var(--fa);white-space:nowrap}
.xc .xb{margin-top:6px;font-size:13px;line-height:1.45;color:#c9d0dc;white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden}
.xc .xm{display:block;width:100%;max-height:220px;margin-top:8px;border-radius:8px;object-fit:cover}
.xc .xs{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:7px;font:500 11px var(--mono);color:var(--fa)}

.empty{padding:40px 24px;text-align:center;color:var(--mu);font-size:13px;line-height:1.6}
.empty b{display:block;color:var(--tx);font-size:14px;margin-bottom:4px}

@media(max-width:560px){.brand span,.openin>span{display:none}.tsel .tnm{display:none}.tsel{padding:0 7px}.top{gap:6px}.mlink{padding:6px 9px}}
@media(max-width:440px){.tier{display:none}.tab{padding:9px 7px 10px;gap:5px}.l1{gap:5px}.top{gap:6px;padding-left:10px;padding-right:10px}}   /* the five tabs still fit a 390px phone */
@media(max-width:380px){.tabs{padding:0 5px}.tab{padding:9px 5px 10px;gap:4px}                 /* ...and a 360px one, */
  .top{gap:5px;padding:10px 8px 8px}.mlink{padding:6px 7px}.tsel{padding:0 6px}}    /* top bar included */

/* ---------- one dense line per row, with a header, like a table, at every width: the feed is kept in a narrow window
   beside a terminal. Calls, theses, locks and trending rows open under their line. ---------- */
.mob{display:none}
.thead,.dsk{display:grid;align-items:center}
.thead{flex:none;width:100%;height:30px;border-bottom:1px solid var(--line);font:600 11px var(--sans);color:var(--fa);letter-spacing:.02em}
.thead span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thead span:nth-child(5),.thead span:nth-child(6){text-align:right}
.dsk{height:40px}
.dsk .c-age{font:400 12px var(--mono);color:var(--mu);white-space:nowrap}
.dsk .c-tr{display:flex;align-items:center;gap:8px;min-width:0;position:relative}
.dsk .c-tr .who{width:20px;height:20px;flex:none;font-size:9px}
.dsk .c-tk{display:flex;align-items:center;gap:8px;min-width:0}
.dsk .c-tk .coin{width:24px;height:24px;border-radius:6px;font-size:11px;flex:none}
.dsk .c-tk .sym{font-size:13.5px;min-width:0}
.dsk .c-tx{display:flex;align-items:center;gap:6px;min-width:0}
.dsk .c-tx .q{font-size:13px;color:#aab3c2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.dsk .c-am{display:flex;justify-content:flex-end}
.dsk .c-am .amt{font-size:13.5px}
.dsk .c-mc{text-align:right;font:500 12.5px var(--mono);color:#c9d0dc;white-space:nowrap}
@media (min-width:760px){
  body{align-items:center}
  .top{align-self:stretch}   /* the site bar spans the window, as on /manage; the feed itself stays a 1040px column */
  .tabs,.banner,#filters,.thead,#wrap{width:100%;max-width:1040px}
  .thead,.dsk{grid-template-columns:54px min(var(--trw,190px),280px) minmax(0,240px) minmax(0,1fr) 104px 88px;column-gap:14px;padding:0 22px 0 14px}
  /* opened, a text too long for its cell (or a trending row's traders) is shown under the row, lined up with the Trader
     column; folded, the cell shows the start of it. The fold button sits at the right end of the cell either way. */
  .r.more.x .drop{display:block;padding:2px 22px 12px 82px}
  .r.more.x .dsk .c-tx .q{visibility:hidden}
  .r.more .dsk .c-tx .tg{display:grid;margin-left:auto}
}
/* Narrower, the line keeps the age, the trader, the coin, the amount and the market cap; a call's or a lock's text has no room
   in it and shows only opened, under the line (they open by default), with the fold button in its own small column. */
@media (max-width:759px){
  .thead,.dsk{grid-template-columns:34px min(var(--trw,120px),42vw) minmax(0,1fr) 22px 56px 52px;column-gap:8px;padding:0 10px 0 10px}
  .thead span:nth-child(4){visibility:hidden}
  .dsk .c-tx .q{display:none}
  .dsk .c-tx .tg{display:grid}
  .r.x .drop{display:block;padding:0 10px 10px 52px}
  .dsk .c-tr{gap:6px} .dsk .c-tr .who{width:18px;height:18px} .dsk .nm{font-size:13px}   /* a little smaller, so the whole name fits and the coin keeps its room */
  .dsk .c-tk{gap:5px} .dsk .c-tk .coin{width:22px;height:22px}
  .dsk .c-tk .sym{font-size:13px}
  .dsk .c-am .amt{font-size:13px}
  .dsk .c-mc{font-size:12px}
  /* room for the ticker: a buy or a sell already reads from the row's colour (bar, name, amount), a lock from "Streamflow" in
     the trader's place, and Solana is the default chain */
  .r:not(.fire) .dsk .tag,.dsk .ch[title="SOL"]{display:none}   /* a call or thesis also reads from its colour and its words right under the line */
}
@media (max-width:480px){
  .thead,.dsk{grid-template-columns:28px min(var(--trw,100px),36vw) minmax(0,1fr) 20px 52px 50px;column-gap:6px;padding:0 8px}
  .dsk .c-tk .ch{padding:2px 3px;font-size:9px}
  .thead{font-size:10.5px}
  .r.x .drop{padding:0 8px 10px 42px}
  .dsk .c-age{font-size:11px}
  .dsk .c-tr{gap:5px} .dsk .c-tr .who{width:16px;height:16px} .dsk .nm{font-size:12.5px}
  .dsk .c-tk{gap:4px} .dsk .c-tk .coin{width:20px;height:20px}
  .dsk .c-am .amt{font-size:12.5px}
  .dsk .c-mc{font-size:11.5px}
  .dsk .c-tx .tg{width:20px;height:20px}
}
@media (max-width:440px){   /* a phone: the name without the face, so the whole name and the ticker both fit */
  .thead,.dsk{grid-template-columns:26px min(var(--trw,90px),32vw) minmax(0,1fr) 20px 48px 46px}
  .dsk .c-tr .who{display:none}
  .dsk .c-am .amt{font-size:12px} .dsk .c-mc{font-size:11px}
}
/* A pop-out window can be far narrower than a browser window: the bar and the tabs still fit at 300px. */
@media(max-width:499px){#bPop{display:none}}
@media(max-width:360px){.top{gap:4px;padding-left:6px;padding-right:6px}.ibtn{width:26px}.tsel{padding:0 5px;gap:5px}}
@media(max-width:340px){.tabs{padding:0 3px}.tab{padding:9px 3px 10px;font-size:12px;gap:3px}}
@media(max-width:330px){.brand{display:none}.gc-nav a{padding:0 6px}.gc-nav .dot{left:15px}}
</style>
</head>
<body>
<div class="top">
  <div class="brand"><img src="/groupchat-logo.png" alt=""><span>GROUPCHAT</span></div>
  <nav class="gc-nav" aria-label="GROUPCHAT pages">
    <a href="/feed" class="on" aria-current="page" title="Live feed" aria-label="Feed"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg><span>Feed</span><span class="dot" id="dot" title="connecting"></span></a>
    <a href="/manage" title="Your alert settings" aria-label="Manage"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"/></svg><span>Manage</span></a>
  </nav>
  <a class="tier" id="tier" href="/manage" title="Your plan">&middot;&middot;&middot;</a>
  <span class="sp"></span>
  <div class="openin" id="openin"><span>Open in</span>
    <button class="tsel" id="termBtn" type="button" aria-haspopup="listbox" aria-expanded="false"><img class="tico" alt="" width="16" height="16"><span class="tnm" id="termName"></span><svg viewBox="0 0 10 6" aria-hidden="true"><path d="M0 0l5 6 5-6z"/></svg></button>
    <div class="tmenu" id="termMenu" role="listbox" aria-label="Open coins in" hidden></div>
  </div>
  <button class="ibtn" id="bSound" title="Sound"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg></button>
  <button class="ibtn" id="bNotif" title="Desktop notifications"><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg></button>
  <button class="ibtn" id="bFold" title="Fold calls, theses and locks"><svg viewBox="0 0 24 24"></svg></button>
  <button class="ibtn" id="bPop" title="Pop out: a narrow window to keep beside your terminal" aria-label="Pop out" hidden><svg viewBox="0 0 24 24"><path d="M14 4h6v6"/><path d="M20 4l-8 8"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></button>
  <button class="ibtn" id="bFilter" title="Filters"><svg viewBox="0 0 24 24"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg></button>
</div>
<div class="tabs" id="tabs"></div>
<div class="banner" id="banner" hidden></div>
<section id="filters">
  <div class="row"><span class="lbl">Source</span><span id="fPlat" class="row"></span></div>
  <div class="row"><span class="lbl">Chain</span><span id="fChain" class="row"></span></div>
  <div class="two">
    <label>Min market cap ($)<input type="number" id="minMc" min="0" step="1000" placeholder="0"></label>
    <label>Min trade size ($)<input type="number" id="minUsd" min="0" step="100" placeholder="0"></label>
  </div>
  <div class="row"><span class="lbl">Muted on this feed (click to unmute)</span><span id="muted" class="row"></span></div>
</section>
<div class="thead"><span>Age</span><span>Trader</span><span>Token</span><span>Call/Thesis</span><span>Amount</span><span>MC</span></div>
<div id="wrap"><main id="list"></main></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const list = $('list');
  const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };

  // Page-wide usage counts through the cookie-less site beacon (/t.js, honours Do Not Track). A label is sent once per
  // page load unless it is a click (capped), so a long-lived side window stays far under the rate limit.
  const sentLabels = new Set(); let clickCount = 0;
  const track = (label, isClick) => {
    try {
      if (!window.gcEvent) return;
      if (isClick) { if (++clickCount > 60) return; } else { if (sentLabels.has(label)) return; sentLabels.add(label); }
      window.gcEvent(label);
    } catch {}
  };
  setInterval(() => { try { if (!document.hidden && window.gcEvent) window.gcEvent('alive10'); } catch {} }, 600000);   // one tick per 10 visible minutes

  const MAX = 200;
  const store = {
    get(k, d) { try { const v = localStorage.getItem('gcfeed.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem('gcfeed.' + k, JSON.stringify(v)); } catch {} }
  };
  // Muted traders, this feed's own (kept in this browser): name in lower case -> when the mute ends (ms; 0 = when unmuted).
  // Stored as [[name, until], ...]; a plain list of names (how mutes were kept before they could end) reads as until unmuted.
  function readMutes() {
    const now = Date.now(), m = new Map(), v = store.get('muted', []);
    for (const x of Array.isArray(v) ? v : []) {
      const [k, u] = Array.isArray(x) ? [x[0], Number(x[1]) || 0] : [x, 0];
      if (typeof k === 'string' && k && (!u || u > now)) m.set(k.toLowerCase(), u);
    }
    return m;
  }
  const mutedNow = (name) => { const u = st.muted.get(String(name).toLowerCase()); return u !== undefined && (!u || u > Date.now()); };
  const MUTE_FOR = [[5, '5 minutes'], [15, '15 minutes'], [60, '1 hour'], [720, '12 hours'], [1440, '24 hours'], [0, 'Until I unmute']];
  const muteLeft = (ms) => { const m = Math.max(1, Math.ceil(ms / 60000)); return m < 60 ? m + 'm' : Math.floor(m / 60) + 'h' + (m % 60 ? ' ' + (m % 60) + 'm' : ''); };

  // The tabs are the type filter. typeKey groups the alert types for the tabs and for the sound.
  // "Calls/Thesis": FOMO only sends theses; pump.fun sends calls, and reposts and replies of calls, which land here too.
  const TYPES = { buy: ['Buys', ['Buy']], sell: ['Sells', ['Sell']], call: ['Calls/Thesis', ['Callout', 'Thesis', 'Repost', 'Reply']], fire: ['Trending', ['CUSTOM_Trending']], lock: ['Locks', ['CUSTOM_Lock']] };
  const TAB_TIP = { call: 'pump.fun calls, with their reposts and replies, and FOMO theses' };
  const typeKey = (t) => Object.keys(TYPES).find((k) => TYPES[k][1].includes(t)) || 'other';
  const TABS = [['all', 'All'], ...Object.keys(TYPES).map((k) => [k, TYPES[k][0]])];
  const CALLISH = new Set(['Callout', 'Thesis', 'Repost', 'Reply']);
  const cls = (t) => t === 'Buy' ? 'buy' : t === 'Sell' ? 'sell' : t === 'Thesis' ? 'thesis' : (t === 'Reply' || t === 'Repost') ? 'reply' : t === 'CUSTOM_Trending' ? 'fire' : t === 'CUSTOM_Lock' ? 'lock' : 'call';
  const TAG = { Buy: 'buy', Sell: 'sell', Callout: 'call', Thesis: 'thesis', Reply: 'reply', Repost: 'repost', CUSTOM_Trending: 'trend', CUSTOM_Lock: 'lock' };
  const TYPE_LABEL = { Buy: 'buy', Sell: 'sell', Callout: 'call', Thesis: 'thesis', Repost: 'repost', Reply: 'reply', CUSTOM_Trending: 'trending', CUSTOM_Lock: 'lock', Deposit: 'deposit', Verified: 'verified' };

  const st = {
    sound: store.get('sound', false), notif: store.get('notif', false), term: store.get('term', 'axiom'),
    offPlat: new Set(store.get('offPlat', [])), offChain: new Set(store.get('offChain', [])),
    minMc: store.get('minMc', 0), minUsd: store.get('minUsd', 0),
    muted: readMutes(), chains: new Set(store.get('chains', [])), tier: 'demo', tab: 'all',
    fold: store.get('fold', false)   // calls / theses shown whole unless the reader folded them
  };
  const save = () => {
    store.set('sound', st.sound); store.set('notif', st.notif); store.set('term', st.term);
    store.set('offPlat', [...st.offPlat]); store.set('offChain', [...st.offChain]);
    store.set('minMc', st.minMc); store.set('minUsd', st.minUsd); store.set('muted', [...st.muted]); store.set('chains', [...st.chains]); store.set('fold', st.fold);
  };

  const money = (n) => n == null ? null : n >= 1e9 ? '$' + (n / 1e9).toFixed(2) + 'B' : n >= 1e6 ? '$' + (n / 1e6).toFixed(2) + 'M' : n >= 1e3 ? '$' + (n / 1e3).toFixed(n >= 1e5 ? 0 : 1) + 'K' : '$' + Math.round(n);
  const ago = (ts) => { const s = Math.max(0, Math.floor((Date.now() - ts) / 1000)); return s < 5 ? 'now' : s < 60 ? s + 's' : s < 3600 ? Math.floor(s / 60) + 'm' : s < 86400 ? Math.floor(s / 3600) + 'h' : Math.floor(s / 86400) + 'd'; };
  const hue = (s) => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
  const TICK = '<svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';
  const COPY = '<svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>';

  /* ---------- sound / desktop notifications ---------- */
  let actx;
  // A padlock snapping shut, for lock alerts: the shackle's light click, then the latch's louder clack with a short metallic
  // ring and a little body. Short bursts of noise through a narrow filter make the clicks; a few detuned sines the ring.
  function padlock(ctx, t) {
    const sr = ctx.sampleRate, buf = ctx.createBuffer(1, Math.floor(sr * 0.06), sr), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const env = (node, at, peak, dur) => { const g = ctx.createGain(); g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(peak, at + 0.0015);
      g.gain.exponentialRampToValueAtTime(0.0001, at + dur); node.connect(g).connect(ctx.destination); return g; };
    const click = (at, freq, peak, dur) => { const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(); s.buffer = buf;
      f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 6; s.connect(f); env(f, at, peak, dur); s.start(at); s.stop(at + dur + 0.01); };
    const tone = (at, freq, peak, dur, type = 'sine') => { const o = ctx.createOscillator(); o.type = type; o.frequency.value = freq; env(o, at, peak, dur); o.start(at); o.stop(at + dur + 0.01); };
    click(t, 3400, 0.5, 0.025);                                                   // the shackle touches
    const c = t + 0.085;
    click(c, 2300, 1.1, 0.045);                                                   // the latch snaps
    tone(c, 170, 0.16, 0.07);                                                     // its body
    [2680, 4120, 6030].forEach((f, i) => tone(c, f, [0.035, 0.022, 0.012][i], 0.2)); // a short metallic ring
  }
  function ping(kind) {
    if (!st.sound) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();

  function openTerm() { termMenu.hidden = false; termBtn.setAttribute('aria-expanded', 'true'); (termMenu.querySelector('[aria-selected="true"]') || termMenu.firstChild).focus(); }
  function closeTerm(refocus) { if (termMenu.hidden) return; termMenu.hidden = true; termBtn.setAttribute('aria-expanded', 'false'); if (refocus) termBtn.focus(); }
  function pickTerm(k) { st.term = k; track('terminal:' + k); save(); showTerm(); closeTerm(true); }
  for (const [k, name] of TERMS) {
    const o = el('button', 'topt'); o.type = 'button'; o.setAttribute('role', 'option'); o.dataset.k = k;
    o.append(ico(k), el('span', null, name)); o.addEventListener('click', () => pickTerm(k)); termMenu.append(o);
  }
  termBtn.addEventListener('click', () => (termMenu.hidden ? openTerm() : closeTerm()));
  termBtn.addEventListener('keydown', (e) => { if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); e.stopPropagation(); openTerm(); } else if (e.key === ' ') e.stopPropagation(); });
  termMenu.addEventListener('keydown', (e) => {
    const items = [...termMenu.children], i = items.indexOf(document.activeElement);
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); items[(i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length].focus(); }
    else if (e.key === 'Home' || e.key === 'End') { e.preventDefault(); items[e.key === 'Home' ? 0 : items.length - 1].focus(); }
    else if (e.key === 'Escape') { e.preventDefault(); closeTerm(true); }
    else if (e.key === 'Tab') closeTerm();
    e.stopPropagation();
  });
  document.addEventListener('pointerdown', (e) => { if (!termMenu.hidden && !e.target.closest('#openin')) closeTerm(); });
  showTerm();
  $('minMc').value = st.minMc || ''; $('minUsd').value = st.minUsd || '';
  $('minMc').addEventListener('input', (e) => { track('filter:mc'); st.minMc = +e.target.value || 0; save(); renderTabs(); rerender(); });
  $('minUsd').addEventListener('input', (e) => { track('filter:usd'); st.minUsd = +e.target.value || 0; save(); renderTabs(); rerender(); });

  renderChips(); renderMuted(); armMutes(); syncButtons(); renderTabs(); setTier('demo'); toggleEmpty();
  connect();
})();
</script>

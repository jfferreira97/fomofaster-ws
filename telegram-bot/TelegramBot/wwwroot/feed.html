<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>/* iPhone / iPad: no zoom-in when a small input or select gets focus (iOS still lets the reader pinch-zoom) */ if (/iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) { const m = document.querySelector('meta[name=viewport]'); m.content += ', maximum-scale=1'; }</script>
<title>GROUPCHAT Feed</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/groupchat-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Flat tracker look: dense rows tinted by their side, a coloured stripe on the left, tabs on top, a table on desktop. */
:root{
  color-scheme:dark;   /* native bits (the terminal picker's list, number spinners) follow the dark page */
  --bg:#090b0f;--p:#0f1218;--p2:#141821;--line:#161b25;--tx:#e8ebf1;--mu:#808a9c;--fa:#586377;
  --buy:#2fd38a;--sell:#f0506e;--call:#e9ab43;--the:#5aa2ff;--fire:#f2c14e;--rep:#a98bf5;--lock:#4fd1e8;
  --s1:var(--p);--s2:var(--p2);--s3:#1c2530;--line2:#2a3243;--accent:var(--call);--accent-dim:#6b551f;--accent-soft:#e9ab431f;--r:7px;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:500 14px/1.4 var(--sans);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ---------- top bar ---------- */
.top{flex:none;display:flex;align-items:center;gap:10px;min-height:48px;padding:10px 14px 8px;background:var(--bg);border-bottom:1px solid var(--line)}
/* The nav both pages share (Feed | Manage): same markup and the same rules in manage.html. */
.gc-nav{display:flex;align-items:center;gap:2px;padding:2px;flex:none;background:#0f1218;border:1px solid #161b25;border-radius:8px}
.gc-nav a{display:flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:6px;font:600 12.5px 'Manrope',system-ui,sans-serif;color:#808a9c;text-decoration:none;white-space:nowrap;transition:color .12s,background-color .12s}
.gc-nav a:hover{color:#e8ebf1}
.gc-nav a.on{color:#e8ebf1;background:#1a1f29;box-shadow:inset 0 0 0 1px #2a3243}
.gc-nav svg{width:14px;height:14px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.gc-nav a.on svg{color:#e9ab43}
@media(max-width:619px){.gc-nav a{padding:0 8px}.gc-nav a>span:not(.dot){display:none}}
.gc-nav a{position:relative}
.gc-nav .dot{position:absolute;top:4px;left:19px;width:6px;height:6px;border:1px solid #0f1218;box-sizing:content-box}   /* the live dot sits on the Feed icon's corner, so both pages' navs are the same width */
.gc-nav .dot.live{box-shadow:0 0 0 2px rgba(47,211,138,.18)}
@media(max-width:619px){.gc-nav .dot{left:17px}}
@media(max-width:759px){.brand span,.openin span{display:none}}
@media(max-width:799px){.openin span{display:none}}   /* room for the plan badge */
@media(max-width:679px){.top{gap:8px}}
@media(max-width:459px){.tier{display:none}}   /* a phone: the bar keeps to the tools (/manage, with fewer buttons, still shows it) */
/* The plan sits right after the nav on both pages (/manage too), worded the same: in full where there is room ("Full access ·
   17 days left"), short on a narrower bar ("17d left"). */
.tier .pl-s{display:none}
@media(max-width:919px){.tier .pl-l{display:none}.tier .pl-s{display:inline}}
.brand,.brand img{flex:none}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;letter-spacing:-.01em;min-width:0}
.brand img{width:24px;height:24px;border-radius:6px}
.sp{flex:1}
.dot{width:7px;height:7px;border-radius:50%;background:var(--fa);flex:none}
.dot.live{background:var(--buy);box-shadow:0 0 0 3px rgba(47,211,138,.15)}
.dot.retry{background:var(--call)}
.tier{flex:none;white-space:nowrap;font:700 10px var(--mono);letter-spacing:.08em;padding:3px 7px;border-radius:5px;text-transform:uppercase;border:1px solid var(--line);color:var(--mu)}
.tier.full{color:var(--buy);border-color:rgba(47,211,138,.35);background:rgba(47,211,138,.08)}
.tier.free,.tier.soon{color:var(--call);border-color:rgba(233,171,67,.35);background:rgba(233,171,67,.08)}
.tier.none{color:var(--sell);border-color:rgba(240,80,110,.35);background:rgba(240,80,110,.08)}
a.tier{text-decoration:none} a.tier:hover{filter:brightness(1.2)}
.mlink{font:500 12.5px var(--sans);color:var(--mu);text-decoration:none;padding:6px 12px;border-radius:var(--r);border:1px solid var(--line);transition:border-color .12s,color .12s}
.mlink:hover{border-color:var(--mu);color:var(--tx)}
.ibtn{width:30px;height:30px;border-radius:var(--r);display:grid;place-items:center;color:var(--mu);border:1px solid transparent;transition:border-color .12s,color .12s;flex:none}
.ibtn:hover{border-color:var(--line);color:var(--tx)}
.ibtn.on{color:var(--accent);border-color:var(--accent-dim);background:var(--accent-soft)}
.ibtn[hidden]{display:none}
.ibtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.openin{display:flex;align-items:center;gap:6px;font:500 12px var(--sans);color:var(--mu);flex:none}
.openin select{width:auto;font:600 12px var(--sans);cursor:pointer;-webkit-appearance:none;appearance:none;height:30px;padding:0 24px 0 9px;line-height:28px;background-image:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2710%27 height=%276%27%3E%3Cpath d=%27M0 0l5 6 5-6z%27 fill=%27%23808a9c%27/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 9px center}   /* drawn by us: Safari made the native one 39px tall */
input[type=number],select{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--tx);border-radius:var(--r);padding:7px 10px;font:12px var(--mono);outline:0}
input:focus,select:focus{border-color:var(--accent-dim)}

.tabs{flex:none;display:flex;gap:2px;padding:0 10px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;appearance:none;background:none;border:0;color:var(--mu);font:600 13px var(--sans);padding:9px 10px 10px;position:relative;cursor:pointer;display:flex;gap:6px;align-items:center}
.tab .n{font:500 10.5px var(--mono);color:var(--fa)}
.tab.on{color:var(--tx)}
.tab.on::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2px;border-radius:2px;background:var(--tx)}
.tab.on .n{color:var(--mu)}

.banner{flex:none;font-size:12px;line-height:1.5;color:var(--mu);padding:8px 14px;background:var(--p);border-bottom:1px solid var(--line)}
.banner a{color:var(--call);text-decoration:none;font-weight:700}
.banner a:hover{text-decoration:underline}
.banner[hidden]{display:none}

#filters{flex:none;padding:12px 14px 14px;border-bottom:1px solid var(--line);background:var(--p);display:none;flex-direction:column;gap:12px}
#filters.open{display:flex}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lbl{font:500 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--fa);width:100%}
.chip{font:500 12px var(--sans);padding:6px 10px;border-radius:var(--r);background:var(--p2);border:1px solid transparent;color:var(--mu);transition:border-color .12s,color .12s}
.chip:hover{color:var(--tx)}
.chip.on{color:var(--accent);border-color:var(--accent-dim);background:var(--accent-soft)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two label{display:flex;flex-direction:column;gap:5px;font-size:11.5px;color:var(--mu)}
.sub{font-size:11.5px;color:var(--fa)}

.thead{display:none}

/* ---------- list ---------- */
#wrap{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;width:100%;position:relative}
#list{flex:1;min-height:0;width:100%;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;overflow-anchor:none}   /* add() keeps a scrolled reader's place itself */
#list::-webkit-scrollbar{display:none}
/* Our own thin scrollbar, laid over the rows' right padding: no arrows, no track, hidden until the reader scrolls
   (new alerts pushing the list do not show it), then fades out. It can be dragged while it shows. */
.sbar{position:absolute;top:0;right:3px;width:5px;height:40px;border-radius:5px;background:rgba(232,235,241,.2);opacity:0;pointer-events:none;touch-action:none;
  transition:opacity .45s ease,width .12s,right .12s,background-color .12s;will-change:transform,opacity}
.sbar.show{opacity:1;pointer-events:auto;transition:opacity .1s,width .12s,right .12s,background-color .12s}
.sbar.show:hover,.sbar.drag{width:7px;right:2px;background:rgba(232,235,241,.36)}
.sbar[hidden]{display:none}
/* every row carries a faint tint of its own colour, as the flat trackers do: green buys, red sells, amber calls... */
.r{--c:var(--mu);position:relative;border-bottom:1px solid var(--line);cursor:pointer;background:color-mix(in srgb,var(--c) 4.5%,transparent);box-shadow:inset 3px 0 0 var(--c)}
.r:hover{background:color-mix(in srgb,var(--c) 9%,transparent)}
.r.buy{--c:var(--buy)} .r.sell{--c:var(--sell)} .r.call{--c:var(--call)} .r.thesis{--c:var(--the)} .r.fire{--c:var(--fire)}
.r.lock{--c:var(--lock)} .r.reply{--c:var(--rep)}
.r.new{animation:in .6s ease-out}
@keyframes in{from{background:color-mix(in srgb,var(--c) 22%,transparent)}}

.coin{display:grid;place-items:center;object-fit:cover;color:#fff;background:var(--p2);font-family:var(--sans);font-weight:800}
.coin.lock{color:var(--fa);border:1px dashed var(--line2);font-weight:700}
.who{display:grid;place-items:center;object-fit:cover;border-radius:50%;color:#fff;font-family:var(--sans);font-weight:800}
.tag{flex:none;font:700 9.5px/1 var(--mono);letter-spacing:.07em;padding:3px 5px;border-radius:4px;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent);text-transform:uppercase}
.sym{font-family:var(--sans);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sym.hid{color:var(--mu);font-weight:700}
.mc{flex:none;font:500 11.5px var(--mono);color:var(--mu)}
.nm{color:var(--c);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;text-decoration:none}
a.nm:hover{text-decoration:underline}
.nm.hid{color:var(--fa);font-weight:500}
.pl{flex:none;font:700 9.5px var(--mono);letter-spacing:.06em}
.pl.pump{color:#e8a04a} .pl.fomo{color:#6ea8ff}
.ch{flex:none;font:500 10.5px var(--mono);color:var(--fa)}
.cp{flex:none;width:22px;height:22px;display:grid;place-items:center;border:1px solid var(--line);border-radius:6px;background:var(--p);color:var(--mu);cursor:pointer;padding:0}
.cp svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cp{transition:color .1s,border-color .1s,background-color .1s,transform .06s}
.cp:hover{color:var(--tx);border-color:var(--line2)}
.cp:active{transform:scale(.86)}
.cp.ok{color:var(--buy);border-color:rgba(47,211,138,.4);background:rgba(47,211,138,.1)}   /* a short tick, not a lingering state */
.mute{flex:none;opacity:0;font:500 10px var(--mono);letter-spacing:.05em;color:var(--mu);padding:1px 6px;border:1px solid var(--line);border-radius:5px;background:var(--p2);transition:opacity .12s}
.r:hover .mute{opacity:1}
.mute:hover{color:var(--sell)}
.valbox{position:relative}
.amt{font:700 15px/1.1 var(--mono);color:var(--c);letter-spacing:-.01em}
.amt.hid{color:var(--fa);letter-spacing:.08em;font-weight:600}
.pos{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:-1px;font:400 7px/1 var(--mono);color:var(--c);opacity:.8;white-space:nowrap}
.age{font:400 11px var(--mono);color:var(--fa)}

/* ---------- phone: two lines per row ---------- */
.mob{display:grid;grid-template-columns:42px minmax(0,1fr) auto;column-gap:11px;align-items:center;padding:11px 22px 11px 14px}
.dsk{display:none}
.tk{position:relative;width:42px;height:42px}
.tk .coin{width:42px;height:42px;border-radius:10px;font-size:16px}
.tk .who{position:absolute;right:-5px;bottom:-5px;width:19px;height:19px;border:2px solid var(--bg);font-size:9px}
.l1{display:flex;align-items:center;gap:7px;min-width:0}
.l1 .sym{font-size:15px;line-height:1.15}
/* the chain sits on the coin's line, as a small chip so it does not read as part of the market cap next to it */
.l1 .ch,.c-tk .ch{flex:none;font:600 9.5px/1 var(--mono);letter-spacing:.05em;color:var(--mu);padding:3px 5px;border:1px solid var(--line2);border-radius:4px;white-space:nowrap}   /* at most 5 letters (CH_SHORT); the ticker gives way, never the chip */
.l2{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:12px;min-width:0;white-space:nowrap}
.m{min-width:0}
.v{display:flex;flex-direction:column;align-items:flex-end;text-align:right}
.v .valbox{margin-bottom:9px}
.v .valbox + .age{margin-top:2px}
.v .age{margin-top:5px}
.txtw{grid-column:2 / 4;margin-top:8px;min-width:0}
.txt{padding-left:9px;border-left:2px solid color-mix(in srgb,var(--c) 60%,transparent);font-size:13px;line-height:1.45;color:#b8c0ce;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}

/* Calls, theses, replies and reposts are shown whole (.r.x) by default. Each folds on its own with its button (it keeps
   its place, open or folded), and the top bar's button folds or unfolds them all. A trending row opens (.r.x) into one line per trader.
   Phone: .txt.long / .txt.short. Desktop: what does not fit its cell is shown under the row (.drop). */
.txtw{display:flex;align-items:flex-start;gap:6px}   /* the fold button at the top right: open or folded, it does not move */
.tb{flex:1;min-width:0}
.ctx{font:500 11px var(--mono);color:var(--mu);margin-bottom:5px}
.txt.long,.drop .full{display:block;-webkit-line-clamp:none;line-clamp:none;overflow:visible;white-space:pre-wrap;line-height:1.5;color:#c9d0dc}
.drop .full{padding-left:9px;border-left:2px solid color-mix(in srgb,var(--c) 60%,transparent);font-size:13px;word-break:break-word}
.drop{display:none}
.r.x .txt.short,.r:not(.x) .txt.long,.r:not(.x) .tb .ctx,.r:not(.x) .tl,.r.x .tsum{display:none}
/* one row's fold / unfold button */
.tg{flex:none;width:22px;height:22px;display:none;place-items:center;border-radius:6px;border:1px solid var(--line);background:var(--p);color:var(--mu);padding:0;cursor:pointer;transition:color .1s,border-color .1s}
.tg svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
.tg:hover{color:var(--tx);border-color:var(--line2)}
.r.x .tg svg{transform:rotate(180deg)}
.r.pmore .mob .tg{display:grid}
/* a trending row, opened: one line per trader, with what they did, their size and their entry (or average entry) */
.tl{display:grid;grid-template-columns:minmax(0,max-content) max-content max-content;column-gap:16px;row-gap:4px;padding-left:9px;border-left:2px solid color-mix(in srgb,var(--c) 60%,transparent);font-size:12.5px;align-items:baseline}
.tl .tn{font-weight:600;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tl .tn::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:7px;vertical-align:1px;background:var(--fa)}
.tl .tn.b::before{background:var(--buy)} .tl .tn.s::before{background:var(--sell)} .tl .tn.p::before{background:#e8a04a}
.tl .tu{font:600 12px var(--mono);color:#c9d0dc;text-align:right}
.tl .te{font:500 11.5px var(--mono);color:var(--mu)}
/* a lock row, opened: the lock itself, one fact a line (how much, when it unlocks, when it was locked, by whom, links) */
.ld{display:grid;grid-template-columns:max-content minmax(0,1fr);column-gap:14px;row-gap:5px;padding-left:9px;border-left:2px solid color-mix(in srgb,var(--c) 60%,transparent);font-size:12.5px;line-height:1.4;align-items:baseline}
.ld .lb{font:500 10.5px var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--mu);white-space:nowrap}
.ld .lv{color:#c9d0dc;min-width:0;overflow-wrap:anywhere}
.ld .sep{color:var(--fa)}
.ld .lt{font:500 12px var(--mono);color:var(--tx)}
.ld a{color:var(--c);font-weight:600;text-decoration:none} .ld a:hover{text-decoration:underline}
.ld .lw{display:inline-flex;align-items:center;gap:7px;vertical-align:middle}
.ld .cp{width:20px;height:20px} .ld .cp svg{width:11px;height:11px}
.r:not(.x) .ld{display:none}

.empty{padding:40px 24px;text-align:center;color:var(--mu);font-size:13px;line-height:1.6}
.empty b{display:block;color:var(--tx);font-size:14px;margin-bottom:4px}

@media(max-width:560px){.brand span,.openin span{display:none}.top{gap:6px}.mlink{padding:6px 9px}}
@media(max-width:440px){.tier{display:none}.tab{padding:9px 7px 10px;gap:5px}.l1{gap:5px}.top{gap:6px;padding-left:10px;padding-right:10px}}   /* the five tabs still fit a 390px phone */
@media(max-width:380px){.tabs{padding:0 5px}.tab{padding:9px 5px 10px;gap:4px}                 /* ...and a 360px one, */
  .top{gap:5px;padding:10px 8px 8px}.mlink{padding:6px 7px}.openin select{padding:5px 4px}}    /* top bar included */

/* ---------- desktop: one dense line per row, with a header, like a table ---------- */
@media (min-width:760px){
  body{align-items:center}
  .top{align-self:stretch}   /* the site bar spans the window, as on /manage; the feed itself stays a 1040px column */
  .tabs,.banner,#filters,.thead,#wrap{width:100%;max-width:1040px}
  .mob{display:none}
  .thead,.dsk{display:grid;grid-template-columns:54px 190px 252px minmax(0,1fr) 112px 92px;column-gap:14px;align-items:center;padding:0 22px 0 14px}
  .thead{flex:none;height:30px;border-bottom:1px solid var(--line);font:600 11px var(--sans);color:var(--fa);letter-spacing:.02em}
  .thead span:nth-child(5),.thead span:nth-child(6){text-align:right}
  .dsk{height:40px}
  .dsk .c-age{font:400 12px var(--mono);color:var(--mu)}
  .dsk .c-tr{display:flex;align-items:center;gap:8px;min-width:0}
  .dsk .c-tr .who{width:20px;height:20px;flex:none;font-size:9px}
  .dsk .c-tk{display:flex;align-items:center;gap:8px;min-width:0}
  .dsk .c-tk .coin{width:24px;height:24px;border-radius:6px;font-size:11px;flex:none}
  .dsk .c-tk .sym{font-size:13.5px}
  .dsk .c-tx{display:flex;align-items:center;gap:6px;min-width:0}
  .dsk .c-tx .q{font-size:13px;color:#aab3c2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  /* opened, a text too long for its cell (or a trending row's traders) is shown under the row, lined up with the Trader
     column; folded, the cell shows the start of it. The fold button sits at the right end of the cell either way. */
  .r.more.x .drop{display:block;padding:2px 22px 12px 82px}
  .r.more.x .dsk .c-tx .q{visibility:hidden}
  .r.more .dsk .c-tx .tg{display:grid;margin-left:auto}
  .dsk .c-am{display:flex;justify-content:flex-end}
  .dsk .c-am .amt{font-size:13.5px}
  .dsk .c-mc{text-align:right;font:500 12.5px var(--mono);color:#c9d0dc}
}
/* A pop-out window can be far narrower than a browser window: the bar and the tabs still fit at 300px. */
@media(max-width:499px){#bPop{display:none}}
@media(max-width:360px){.top{gap:4px;padding-left:6px;padding-right:6px}.ibtn{width:26px}.openin select{padding:0 20px 0 7px;background-position:right 7px center}}
@media(max-width:340px){.tabs{padding:0 3px}.tab{padding:9px 3px 10px;font-size:12px;gap:3px}}
@media(max-width:330px){.brand{display:none}.gc-nav a{padding:0 6px}.gc-nav .dot{left:15px}}
</style>
</head>
<body>
<div class="top">
  <div class="brand"><img src="/groupchat-logo.png" alt=""><span>GROUPCHAT</span></div>
  <nav class="gc-nav" aria-label="GROUPCHAT pages">
    <a href="/feed" class="on" aria-current="page" title="Live feed" aria-label="Feed"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg><span>Feed</span><span class="dot" id="dot" title="connecting"></span></a>
    <a href="/manage" title="Your alert settings" aria-label="Manage"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"/></svg><span>Manage</span></a>

  <button class="ibtn" id="bNotif" title="Desktop notifications"><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg></button>

  <div class="row"><span class="lbl">Source</span><span id="fPlat" class="row"></span></div>
  <div class="row"><span class="lbl">Chain</span><span id="fChain" class="row"></span></div>

    <label>Min trade size ($)<input type="number" id="minUsd" min="0" step="100" placeholder="0"></label>

</section>
<div class="thead"><span>Age</span><span>Trader</span><span>Token</span><span>Call/Thesis</span><span>Amount</span><span>MC</span></div>
<div id="wrap"><main id="list"></main></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const list = $('list');
  const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };

  // Page-wide usage counts through the cookie-less site beacon (/t.js, honours Do Not Track). A label is sent once per
  // page load unless it is a click (capped), so a long-lived side window stays far under the rate limit.
  const sentLabels = new Set(); let clickCount = 0;
  const track = (label, isClick) => {
    try {
      if (!window.gcEvent) return;
      if (isClick) { if (++clickCount > 60) return; } else { if (sentLabels.has(label)) return; sentLabels.add(label); }
      window.gcEvent(label);
    } catch {}
  };
  setInterval(() => { try { if (!document.hidden && window.gcEvent) window.gcEvent('alive10'); } catch {} }, 600000);   // one tick per 10 visible minutes

  const MAX = 200;
  const store = {
    get(k, d) { try { const v = localStorage.getItem('gcfeed.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem('gcfeed.' + k, JSON.stringify(v)); } catch {} }
  };

  // The tabs are the type filter. typeKey groups the alert types for the tabs and for the sound.
  // "Calls/Thesis": FOMO only sends theses; pump.fun sends calls, and reposts and replies of calls, which land here too.
  const TYPES = { buy: ['Buys', ['Buy']], sell: ['Sells', ['Sell']], call: ['Calls/Thesis', ['Callout', 'Thesis', 'Repost', 'Reply']], fire: ['Trending', ['CUSTOM_Trending']], lock: ['Locks', ['CUSTOM_Lock']] };
  const TAB_TIP = { call: 'pump.fun calls, with their reposts and replies, and FOMO theses' };
  const typeKey = (t) => Object.keys(TYPES).find((k) => TYPES[k][1].includes(t)) || 'other';
  const TABS = [['all', 'All'], ...Object.keys(TYPES).map((k) => [k, TYPES[k][0]])];
  const CALLISH = new Set(['Callout', 'Thesis', 'Repost', 'Reply']);
  const cls = (t) => t === 'Buy' ? 'buy' : t === 'Sell' ? 'sell' : t === 'Thesis' ? 'thesis' : (t === 'Reply' || t === 'Repost') ? 'reply' : t === 'CUSTOM_Trending' ? 'fire' : t === 'CUSTOM_Lock' ? 'lock' : 'call';
  const TAG = { Buy: 'buy', Sell: 'sell', Callout: 'call', Thesis: 'thesis', Reply: 'reply', Repost: 'repost', CUSTOM_Trending: 'trend', CUSTOM_Lock: 'lock' };
  const TYPE_LABEL = { Buy: 'buy', Sell: 'sell', Callout: 'call', Thesis: 'thesis', Repost: 'repost', Reply: 'reply', CUSTOM_Trending: 'trending', CUSTOM_Lock: 'lock', Deposit: 'deposit', Verified: 'verified' };

  const st = {
    sound: store.get('sound', false), notif: store.get('notif', false), term: store.get('term', 'axiom'),
    offPlat: new Set(store.get('offPlat', [])), offChain: new Set(store.get('offChain', [])),
    minMc: store.get('minMc', 0), minUsd: store.get('minUsd', 0),
    muted: new Set(store.get('muted', [])), chains: new Set(store.get('chains', [])), tier: 'demo', tab: 'all',
    fold: store.get('fold', false)   // calls / theses shown whole unless the reader folded them
  };
  const save = () => {
    store.set('sound', st.sound); store.set('notif', st.notif); store.set('term', st.term);
    store.set('offPlat', [...st.offPlat]); store.set('offChain', [...st.offChain]);
    store.set('minMc', st.minMc); store.set('minUsd', st.minUsd); store.set('muted', [...st.muted]); store.set('chains', [...st.chains]); store.set('fold', st.fold);
  };

  const money = (n) => n == null ? null : n >= 1e9 ? '$' + (n / 1e9).toFixed(2) + 'B' : n >= 1e6 ? '$' + (n / 1e6).toFixed(2) + 'M' : n >= 1e3 ? '$' + (n / 1e3).toFixed(n >= 1e5 ? 0 : 1) + 'K' : '$' + Math.round(n);
  const ago = (ts) => { const s = Math.max(0, Math.floor((Date.now() - ts) / 1000)); return s < 5 ? 'now' : s < 60 ? s + 's' : s < 3600 ? Math.floor(s / 60) + 'm' : s < 86400 ? Math.floor(s / 3600) + 'h' : Math.floor(s / 86400) + 'd'; };
  const hue = (s) => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
  const TICK = '<svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';
  const COPY = '<svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>';

  /* ---------- sound / desktop notifications ---------- */
  let actx;
  function ping(kind) {
    if (!st.sound) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const now = actx.currentTime;
      const notes = kind === 'sell' ? [440, 330] : kind === 'fire' ? [660, 880, 1100] : [660, 990];
      notes.forEach((f, i) => {
        const o = actx.createOscillator(), g = actx.createGain();
        o.type = 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(0, now + i * .07);
        g.gain.linearRampToValueAtTime(.12, now + i * .07 + .01);
        g.gain.exponentialRampToValueAtTime(.0001, now + i * .07 + .22);
        o.connect(g).connect(actx.destination);
        o.start(now + i * .07); o.stop(now + i * .07 + .25);
      });
    } catch {}
  }
  function desktop(a) {
    if (!st.notif || !('Notification' in window) || Notification.permission !== 'granted' || !document.hidden) return;
    try { new Notification((a.trader || 'Alert') + ' · ' + (TYPE_LABEL[a.type] || a.type), { body: a.msg, tag: 'gc' + a.id, silent: true }); } catch {}
  }

  // The filters in the panel (not the tab).
  function pass(a) {
    if (st.offPlat.has(a.platform)) return false;
    if (a.chain && st.offChain.has(a.chain)) return false;
    if (a.trader && st.muted.has(a.trader.toLowerCase())) return false;
    if (st.minMc && a.mc != null && a.mc < st.minMc) return false;
    if (st.minUsd && a.usd != null && a.usd < st.minUsd) return false;
    return true;
  }
  const inTab = (a, id) => id === 'all' || (TYPES[id] && TYPES[id][1].includes(a.type));

  // For calls the row shows only the caller's own words, not the "TICKER callout by x: ($y MC)" lead or the position line.
  function quote(a) {
    const m = a.msg || '', parts = m.split(/\n\s*\n/);
    if (parts.length > 1) { const rest = parts.slice(1).filter((p) => !/^Current \$/.test(p.trim())); if (rest.length) return rest.join(' ').replace(/\s+/g, ' ').trim(); }
    return m.replace(/^.*?:\s*\([^)]*MC\)\s*/s, '').replace(/\s+/g, ' ').trim() || m;
  }
  // The same words for the drop-down, with the caller's own line breaks kept.
  function fullQuote(a) {
    const m = a.msg || '', parts = m.split(/\n\s*\n/);
    if (parts.length > 1) { const rest = parts.slice(1).filter((p) => !/^Current \$/.test(p.trim())); if (rest.length) return rest.join('\n\n').replace(/[ \t]+/g, ' ').replace(/\n{3,}/g, '\n\n').trim(); }
    return quote(a);
  }
  // What a reply or repost answers: "TICKER ($x MC) 💬 bob replied on alice's callout:" -> "replied on alice's callout".
  function context(a) {
    if (a.type !== 'Reply' && a.type !== 'Repost') return '';
    const r = /\b(replied on|reposted)\s+(.+?)\s*:?\s*$/.exec(((a.msg || '').split(/\n\s*\n/)[0] || '').trim());
    return r ? r[1] + ' ' + r[2] : '';
  }
  function trendText(a) {
    const parts = (a.msg || '').split('\n'), m = /\((\d+) traders\)/.exec(parts[0] || '');
    const l = (parts[1] || '').split(' | ').map((s) => s.replace(/ @ (avg )?\$\S+ MC/, '').trim()).filter(Boolean);
    return l.length ? (m ? m[1] : l.length) + ' traders: ' + l.slice(0, 3).join('  ·  ') + (l.length > 3 ? '  +' + (l.length - 3) : '') : (a.msg || '');
  }

  const all = [], seen = new Set();      // oldest first
  const nodes = new Map();
  const openUrl = (a) => { const l = a.links; return l ? (l[st.term] || l.dex || l.axiom || l.padre || null) : null; };

  // pieces shared by the phone and the desktop layout (each call makes a fresh element)
  const coinEl = (a) => {
    const locked = !!a.locked;
    // A locked (free / demo) row gets a "?" tile, so the slot shows there is a coin but never which.
    const tile = () => { const t = el('div', 'coin' + (locked ? ' lock' : ''), locked ? '?' : [...(a.ticker || '?')][0].toUpperCase()); if (!locked) { const h = hue(a.ticker || '?'); t.style.background = `linear-gradient(135deg,hsl(${h} 55% 36%),hsl(${(h + 40) % 360} 50% 24%))`; } return t; };
    if (!a.img) return tile();
    const i = el('img', 'coin'); i.src = a.img; i.alt = ''; i.loading = 'lazy'; i.decoding = 'async'; i.referrerPolicy = 'no-referrer'; i.addEventListener('error', () => i.replaceWith(tile()), { once: true }); return i;
  };
  const whoEl = (a) => {
    if (!a.trader) return null;
    const badge = () => { const b = el('div', 'who', [...a.trader.replace(/^@/, '')][0].toUpperCase()); const h = hue(a.trader); b.style.background = `linear-gradient(135deg,hsl(${h} 75% 58%),hsl(${(h + 50) % 360} 80% 42%))`; return b; };
    if (!a.av) return badge();
    const i = el('img', 'who'); i.src = a.av; i.alt = ''; i.loading = 'lazy'; i.decoding = 'async'; i.referrerPolicy = 'no-referrer'; i.addEventListener('error', () => i.replaceWith(badge()), { once: true }); return i;
  };
  const symEl = (a) => el('span', 'sym' + (a.ticker ? '' : ' hid'), a.ticker || 'coin');
  // A copy button. No title tooltip (it hung on after the click); a tick for half a second, then straight back.
  const copyBtn = (text, label, what) => {
    const b = el('button', 'cp'); b.innerHTML = COPY; b.setAttribute('aria-label', label); let t = 0;
    b.addEventListener('click', (e) => { e.stopPropagation(); track(what, true); navigator.clipboard?.writeText(text).then(() => {
      b.classList.add('ok'); b.innerHTML = TICK; clearTimeout(t); t = setTimeout(() => { b.classList.remove('ok'); b.innerHTML = COPY; }, 550); }).catch(() => {}); });
    return b;
  };
  const copyEl = (a) => a.ca ? copyBtn(a.ca, 'Copy contract', 'copy') : null;
  const nameEl = (a) => {
    if (a.type === 'CUSTOM_Lock') return el('span', 'nm', '🔒 Streamflow');
    if (!a.trader) return el('span', 'nm hid', a.type === 'CUSTOM_Trending' ? '' : 'trader hidden');
    if (!a.profile) return el('span', 'nm', a.trader);
    const n = el('a', 'nm', a.trader); n.href = a.profile; n.target = '_blank'; n.rel = 'noopener noreferrer'; n.addEventListener('click', (e) => e.stopPropagation()); return n;
  };
  const muteEl = (a) => {
    if (!a.trader) return null;
    const x = el('button', 'mute', 'mute'); x.title = 'Mute ' + a.trader;
    x.addEventListener('click', (e) => { e.stopPropagation(); track('mute', true); st.muted.add(a.trader.toLowerCase()); save(); renderMuted(); renderTabs(); rerender(); });
    return x;
  };
  const amountEl = (a) => {   // the value; on a call it is the caller's position, said small and centred under the number
    const isTrade = a.type === 'Buy' || a.type === 'Sell';
    if (a.usd != null) { const vb = el('div', 'valbox'); vb.append(el('div', 'amt', money(a.usd))); if (CALLISH.has(a.type)) vb.append(el('div', 'pos', '(position size)')); else if (a.type === 'CUSTOM_Lock') vb.append(el('div', 'pos', '(locked)')); return vb; }
    if (isTrade) { const vb = el('div', 'valbox'); vb.append(el('div', 'amt hid', '$•••')); return vb; }
    return null;
  };
  const textOf = (a) => CALLISH.has(a.type) ? quote(a) : a.type === 'CUSTOM_Trending' ? trendText(a) : a.type === 'CUSTOM_Lock' ? lockText(a) : (a.type === 'Buy' || a.type === 'Sell') ? '' : (a.msg || '');
  // A lock row reads "2.42% of supply · for 16d · until Dec 1, 2026 · token 2d old": the value locked and the market cap have
  // their own columns. From the alert's two lines (the old FasterAlerts wording):
  //   🔒 2.42% of $SYM ($37.52k MC) LOCKED · 2d 4h old
  //   ⏰ For: 16d | Until Dec 1, 2026 05:00 UTC        (or "⏰ Until: See Streamflow")
  function lockText(a) {
    const [l1 = '', l2 = ''] = (a.msg || '').split('\n');
    const pct = /([\d.?]+%) of/.exec(l1)?.[1];
    const age = /· (\d+(?:d|h|min)\b[^·]*?) old\s*$/.exec(l1)?.[1]?.replace(/ \d+[hm]$/, '');
    const dur = /For: ([^|]+?) \|/.exec(l2)?.[1];
    const until = /Until:? (.+?)(?: \d{1,2}:\d{2} UTC)?$/.exec(l2)?.[1]?.replace(', ' + new Date().getUTCFullYear(), '');   // this year's dates go without the year
    const parts = [pct ? pct + ' of supply' : '', dur || '', until ? (dur ? 'until ' + until : 'unlock: ' + until.replace(/^See/, 'see')) : '', age ? 'token ' + age + ' old' : ''];
    return parts.filter(Boolean).join(' · ') || l1.replace(/^🔒\s*/u, '');
  }
  // A lock row, opened (a.lk, from the lock itself): how much, when it unlocks (and is fully vested, when that is later), when it
  // was locked, by which wallet (with a copy button), and the Streamflow / Solscan links. Times in the reader's own time zone (the
  // bot's alert says UTC; the tooltip does too). The free feed's a.lk has no tokens, wallet or links.
  const B58 = /^[1-9A-HJ-NP-Za-km-z]{32,90}$/;
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const local = (ms) => { const d = new Date(ms), p = (n) => String(n).padStart(2, '0');
    return MON[d.getMonth()] + ' ' + d.getDate() + (d.getFullYear() !== new Date().getFullYear() ? ', ' + d.getFullYear() : '') + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()); };
  function span(ms) {   // the bot's wording (OldTimeUntil): 12mo 4d · 16d · 2d 4h · 5h 20m · 45m
    const m = Math.max(0, Math.round(ms / 60000)), d = Math.floor(m / 1440);
    if (d >= 60) { const mo = Math.floor(d / 30), r = d % 30; return mo + 'mo' + (r ? ' ' + r + 'd' : ''); }
    if (d >= 1) { const h = Math.floor((m % 1440) / 60); return d + 'd' + (d < 3 && h ? ' ' + h + 'h' : ''); }
    const h = Math.floor(m / 60); return h ? h + 'h' + (m % 60 ? ' ' + (m % 60) + 'm' : '') : m + 'm';
  }
  const tokFmt = new Intl.NumberFormat('en', { notation: 'compact', maximumFractionDigits: 2 });
  function lockList(a) {
    const k = a.lk, g = el('div', 'ld'), now = Date.now();
    const row = (label, ...parts) => {
      const v = el('span', 'lv');
      for (const p of parts.filter(Boolean)) { if (v.childNodes.length) v.append(el('span', 'sep', ' · ')); v.append(typeof p === 'string' ? document.createTextNode(p) : p); }
      if (v.childNodes.length) g.append(el('span', 'lb', label), v);
    };
    const when = (ms) => { const x = el('span', 'lt', local(ms)); x.title = new Date(ms).toUTCString(); return x; };
    const soon = (ms) => ms > now ? 'in ' + span(ms - now) : 'already open';
    const link = (text, href) => { const x = el('a', null, text); x.href = href; x.target = '_blank'; x.rel = 'noopener noreferrer'; x.addEventListener('click', (e) => e.stopPropagation()); return x; };
    row('Locked', k.tokens != null ? tokFmt.format(k.tokens) + ' tokens' : '', k.pct != null ? (+k.pct).toFixed(2) + '% of supply' : '', a.usd != null ? money(a.usd) : '');
    const unlock = k.cliff && k.start && k.cliff > k.start ? k.cliff : k.end;
    if (unlock) row('Unlocks', when(unlock), soon(unlock));
    else row('Unlocks', 'on price targets, see Streamflow');
    if (unlock && k.end && k.end - unlock > 36e5) row('Fully vested', when(k.end), soon(k.end));
    if (k.at) row('Locked at', when(k.at), a.mc != null ? money(a.mc) + ' MC' : '', k.born && k.at > k.born ? 'token ' + span(k.at - k.born) + ' old' : '');
    if (k.by && B58.test(k.by)) { const w = el('span', 'lw'); w.append(link(k.by.slice(0, 4) + '…' + k.by.slice(-4), 'https://solscan.io/account/' + k.by), copyBtn(k.by, 'Copy wallet', 'copy:wallet')); row('Locked by', w); }
    row('Links', k.sf && B58.test(k.sf) ? link('Streamflow ↗', 'https://app.streamflow.finance/contract/solana/mainnet/' + k.sf) : null,
      k.tx && B58.test(k.tx) ? link('Solscan ↗', 'https://solscan.io/tx/' + k.tx) : null);
    return g;
  }
  const ageEl = (a) => { const x = el('div', 'age ago', ago(a.ts)); x.dataset.ts = a.ts; return x; };
  // The chain chip, next to the coin. Long chain names are shortened so the ticker keeps its room; the full name is the tooltip.
  const CH_SHORT = { ROBINHOOD: 'HOOD', HYPEREVM: 'HYPE', MEGAETH: 'MEGA', ELYSIUM: 'ELYS' };
  const chainEl = (a) => { const c = el('span', 'ch', CH_SHORT[a.chain] || a.chain); c.title = a.chain; return c; };

  /* ---------- once per frame: which call rows do not fit their desktop cell (shown whole under the row), and the scrollbar's size ---------- */
  const fitQ = new Set(); let raf = 0;
  function frame() { if (!raf) raf = requestAnimationFrame(onFrame); }
  // Does the row have more to show than it shows folded? d: desktop (the text overflows its cell), p: phone (more than two
  // lines). null when that layout is not on screen: left as it is.
  function overflows(r) {
    if (r._ctx) return { d: true, p: true };   // a reply / repost always has more to show: what it answers
    const q = r.querySelector('.dsk .q'), lg = r.querySelector('.mob .txt.long'), sh = r.querySelector('.mob .txt.short');
    const d = q && q.clientWidth > 0 ? q.scrollWidth > q.clientWidth + 1 : null;   // .q keeps its layout (visibility) when hidden
    let p = null;
    if (lg && lg.clientHeight > 0) p = lg.scrollHeight > 2.5 * parseFloat(getComputedStyle(lg).lineHeight);
    else if (sh && sh.clientHeight > 0) p = sh.scrollHeight > sh.clientHeight + 1;
    return { d, p };
  }
  function onFrame() {
    raf = 0;
    const rs = [...fitQ].filter((r) => r.isConnected); fitQ.clear();
    const res = rs.map(overflows);                                                // all reads first...
    rs.forEach((r, i) => { const o = res[i]; if (o.d != null) r.classList.toggle('more', o.d); if (o.p != null) r.classList.toggle('pmore', o.p); });   // ...then the writes
    placeBar();
  }
  // Re-measure every shown call row: after a resize, and once the web fonts arrive (the first pass may use the fallback font).
  const refit = () => { list.querySelectorAll('.r').forEach((r) => { if (r._fit) fitQ.add(r); }); frame(); };
  window.addEventListener('resize', refit);
  if (document.fonts) { document.fonts.ready.then(refit).catch(() => {}); document.fonts.addEventListener?.('loadingdone', refit); }

  /* ---------- the scrollbar: ours, thin, shown only while the reader scrolls ---------- */
  const bar = el('div', 'sbar'); bar.hidden = true; $('wrap').append(bar);
  let userAt = -1e9, hideT = 0, dragging = false, hovering = false;
  function placeBar() {
    const ch = list.clientHeight, sh = list.scrollHeight;
    if (!ch || sh <= ch + 1) { bar.hidden = true; bar.classList.remove('show'); return; }
    bar.hidden = false;
    const h = Math.max(36, Math.round(ch * ch / sh)), y = (ch - h) * Math.min(1, Math.max(0, list.scrollTop / (sh - ch)));
    bar.style.height = h + 'px'; bar.style.transform = 'translateY(' + y + 'px)';
  }
  function showBar() {
    if (bar.hidden) return;
    bar.classList.add('show'); clearTimeout(hideT);
    hideT = setTimeout(function hide() { if (dragging || hovering) { hideT = setTimeout(hide, 500); return; } bar.classList.remove('show'); }, 1100);
  }
  // A scroll only counts as the reader's when it follows their own input (a wheel, a finger moving, a scroll key);
  // the list moving for new alerts, a tab change or a tap does not show the bar.
  const userInput = () => { userAt = performance.now(); };
  for (const t of ['wheel', 'touchmove']) list.addEventListener(t, userInput, { passive: true });
  const SCROLL_KEYS = new Set(['ArrowUp', 'ArrowDown', 'PageUp', 'PageDown', 'Home', 'End', ' ']);
  document.addEventListener('keydown', (e) => {
    const t = e.target;
    if (!SCROLL_KEYS.has(e.key) || e.ctrlKey || e.metaKey || e.altKey || /^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName) || (e.key === ' ' && t.closest?.('button,a'))) return;
    userInput();
    // The list is an inner scroller and the page itself never scrolls, so the browser sends these keys nowhere: scroll the list.
    if (t.closest?.('#filters')) return;
    e.preventDefault();
    const page = Math.max(40, list.clientHeight - 60), step = { ArrowDown: 48, ArrowUp: -48, PageDown: page, PageUp: -page, ' ': e.shiftKey ? -page : page }[e.key];
    if (e.key === 'Home') list.scrollTo({ top: 0, behavior: 'smooth' });
    else if (e.key === 'End') list.scrollTo({ top: list.scrollHeight, behavior: 'smooth' });
    else list.scrollBy({ top: step, behavior: e.repeat ? 'auto' : 'smooth' });
  });
  list.addEventListener('scroll', () => { placeBar(); if (dragging || performance.now() - userAt < 1200) showBar(); }, { passive: true });
  // The bar sits beside the list, not in it: a wheel over it is passed on to the list.
  bar.addEventListener('wheel', (e) => { e.preventDefault(); userInput(); list.scrollTop += e.deltaY * (e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? list.clientHeight : 1); }, { passive: false });
  bar.addEventListener('pointerenter', () => { hovering = true; });
  bar.addEventListener('pointerleave', () => { hovering = false; });
  bar.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    e.preventDefault(); dragging = true; bar.classList.add('drag'); showBar();
    try { bar.setPointerCapture(e.pointerId); } catch {}
    let ly = e.clientY;
    const move = (ev) => {   // relative steps (rows arriving mid-drag do not make the list jump), advanced only by what the list really moved
      const k = (list.scrollHeight - list.clientHeight) / Math.max(1, list.clientHeight - bar.offsetHeight);
      const t0 = list.scrollTop; list.scrollTop = t0 + (ev.clientY - ly) * k; ly += (list.scrollTop - t0) / k;
    };
    const end = () => { dragging = false; bar.classList.remove('drag'); bar.removeEventListener('pointermove', move); bar.removeEventListener('lostpointercapture', end); bar.removeEventListener('pointerup', end); showBar(); };
    bar.addEventListener('pointermove', move); bar.addEventListener('lostpointercapture', end); bar.addEventListener('pointerup', end);
  });

  // One row's fold / unfold button (calls and trending rows), and opening or folding one row.
  const CHEV = '<svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>';
  const tgEl = (r) => { const b = el('button', 'tg'); b.innerHTML = CHEV;
    b.addEventListener('click', (e) => { e.stopPropagation(); setOpen(r, !r.classList.contains('x')); track(r.classList.contains('x') ? 'row:open' : 'row:fold', true); }); return b; };
  function setOpen(r, open) {
    r.classList.toggle('x', open);
    for (const b of r.querySelectorAll('.tg')) { const t = open ? 'Fold' : 'Show in full'; b.title = t; b.setAttribute('aria-label', t); b.setAttribute('aria-expanded', String(open)); }
    if (r._fit) fitQ.add(r);
    frame();
  }
  // A trending alert's second line, one trader each: "name \u{1F7E2} $2,222 @ $122.02k MC" (one buy), "@ avg $124k MC" (several),
  // "name \u{1F48A} $1,701" (a pump.fun trader, no cap); green circle bought, red circle sold.
  const TREND_SIDE = { '\u{1F7E2}': 'b', '\u{1F534}': 's', '\u{1F48A}': 'p' };
  const TREND_RX = /^(\S+)\s*(\u{1F7E2}|\u{1F534}|\u{1F48A})?\s*(\$[\d,.]+[kKmMbB]?)?\s*(?:@\s*(avg\s+)?(\$[\d.,]+[kKmMbB]?)\s*MC)?/u;
  function trendRows(a) {
    const line = (a.msg || '').split('\n')[1] || '';
    return line.split(' | ').map((x) => {
      const m = TREND_RX.exec(x.trim());
      return m && m[1] ? { name: m[1], side: TREND_SIDE[m[2]] || '', usd: m[3] || '', avg: !!m[4], mc: m[5] || '' } : null;
    }).filter(Boolean);
  }
  const trendList = (rows) => {
    const g = el('div', 'tl');
    for (const t of rows) {
      const n = el('span', 'tn' + (t.side ? ' ' + t.side : ''), t.name); n.title = { b: 'bought', s: 'sold', p: 'pump.fun' }[t.side] || '';
      g.append(n, el('span', 'tu', t.usd), el('span', 'te', t.mc ? (t.avg ? 'avg ' : '@ ') + t.mc + ' MC' : ''));
    }
    return g;
  };

  function build(a, isNew) {
    const r = el('div', 'r ' + cls(a.type) + (isNew ? ' new' : '')); r.dataset.id = a.id;
    const txt = textOf(a);

    // phone
    const mob = el('div', 'mob'), tk = el('div', 'tk'); tk.append(coinEl(a)); const w = whoEl(a); if (w) tk.append(w);
    const m = el('div', 'm'), l1 = el('div', 'l1'), l2 = el('div', 'l2');
    l1.append(el('span', 'tag', TAG[a.type] || a.type.toLowerCase()), symEl(a));
    if (a.chain) l1.append(chainEl(a));    // next to the coin, not on the trader's line
    if (a.mc != null) l1.append(el('span', 'mc', money(a.mc)));
    const cp = copyEl(a); if (cp) l1.append(cp);
    if (a.type === 'CUSTOM_Lock') l2.append(nameEl(a));
    else if (a.type !== 'CUSTOM_Trending') l2.append(nameEl(a), el('span', 'pl ' + (a.platform === 'pump' ? 'pump' : 'fomo'), a.platform === 'pump' ? 'PUMP' : 'FOMO'));
    const mu1 = muteEl(a); if (mu1) l2.append(mu1);
    m.append(l1, l2);
    const v = el('div', 'v'), am = amountEl(a); if (am) v.append(am); v.append(ageEl(a));
    mob.append(tk, m, v);
    // A call / thesis / reply / repost is shown whole (with what it answers), or as the 2-line preview when folded.
    // A trending row shows "N traders: a · b · c", and opens into one line per trader.
    const isCall = CALLISH.has(a.type) && !!txt, ctx = isCall ? context(a) : '', full = isCall ? fullQuote(a) : '';
    const trend = a.type === 'CUSTOM_Trending' ? trendRows(a) : [], isLock = a.type === 'CUSTOM_Lock' && !!a.lk;
    const canOpen = isCall || trend.length > 0 || isLock;
    if (txt) {
      const tw = el('div', 'txtw'), tb = el('div', 'tb');
      if (isCall) { if (ctx) tb.append(el('div', 'ctx', '↳ ' + ctx)); tb.append(el('div', 'txt long', full), el('div', 'txt short', txt)); }
      else if (trend.length) tb.append(el('div', 'txt tsum', txt), trendList(trend));
      else if (isLock) tb.append(el('div', 'txt tsum', txt), lockList(a));
      else tb.append(el('div', 'txt', txt));
      tw.append(tb); if (canOpen) tw.append(tgEl(r));
      mob.append(tw);
    }

    // desktop: age | trader | token | call text | amount | mc
    const dsk = el('div', 'dsk');
    const cAge = el('div', 'c-age ago', ago(a.ts)); cAge.dataset.ts = a.ts;
    const cTr = el('div', 'c-tr'); const w2 = whoEl(a); if (w2) cTr.append(w2); cTr.append(nameEl(a)); const mu2 = muteEl(a); if (mu2) cTr.append(mu2);
    const cTk = el('div', 'c-tk'); cTk.append(coinEl(a), el('span', 'tag', TAG[a.type] || a.type.toLowerCase()), symEl(a)); if (a.chain) cTk.append(chainEl(a)); const cp2 = copyEl(a); if (cp2) cTk.append(cp2);
    const cTx = el('div', 'c-tx'); cTx.append(el('span', 'q', txt)); if (canOpen) cTx.append(tgEl(r));
    const cAm = el('div', 'c-am'); const am2 = amountEl(a); if (am2) cAm.append(am2);
    const cMc = el('div', 'c-mc', a.mc != null ? money(a.mc) : '');
    dsk.append(cAge, cTr, cTk, cTx, cAm, cMc);

    r.append(mob, dsk);
    if (canOpen) {   // desktop: what does not fit the cell, under the row (the row gets "more"), with its fold button
      const d = el('div', 'drop'), tb = el('div', 'tb');
      if (isCall) { if (ctx) tb.append(el('div', 'ctx', '↳ ' + ctx)); tb.append(el('div', 'full', full)); }
      else tb.append(isLock ? lockList(a) : trendList(trend));
      d.append(tb); r.append(d);
      if (isCall) { r._fit = true; if (ctx) r._ctx = true; }
      else r.classList.add('more', 'pmore');   // a trending row always has more (each trader's size and entry), a lock row the lock's details
      if (isLock) r._lock = true;
      setOpen(r, (isCall || isLock) && !st.fold);   // calls and locks open unless the reader folded them all; trending rows start closed
    }
    r.addEventListener('click', () => {
      const s = window.getSelection?.(); if (s && !s.isCollapsed && r.contains(s.anchorNode)) return;   // selecting text to copy it is not a click on the coin
      const u = openUrl(a); if (u) { track('open:' + st.term, true); window.open(u, '_blank', 'noopener,noreferrer'); }
    });
    return r;
  }

  function renderTabs() {
    const box = $('tabs'); box.replaceChildren();
    for (const [id, label] of TABS) {
      const n = all.filter((a) => pass(a) && inTab(a, id)).length;
      const b = el('button', 'tab' + (id === st.tab ? ' on' : ''), label); b.append(el('span', 'n', String(n))); if (TAB_TIP[id]) b.title = TAB_TIP[id];
      b.addEventListener('click', () => { st.tab = id; track('tab:' + id); renderTabs(); rerender(); }); box.append(b);
    }
  }
  const rows = () => list.querySelectorAll('.r');
  function toggleEmpty() {
    const has = rows().length > 0;
    let e = list.querySelector('.empty');
    if (has && e) e.remove();
    if (!has && !e) {
      e = el('div', 'empty');
      e.append(el('b', null, st.tier === 'demo' ? 'Waiting for the next alert' : 'Nothing yet'),
        document.createTextNode(st.tier === 'demo'
          ? 'The preview shows alerts as they happen, with the coin name hidden.'
          : 'Alerts for the traders you follow land here the instant they fire. Pick traders at /manage.'));
      list.append(e);
    }
  }
  function rerender() {
    list.replaceChildren();
    // newest on top, at most MAX rows (the history in `all` grows all day; a tab click must not rebuild all of it)
    for (let i = all.length - 1, k = 0; i >= 0 && k < MAX; i--) {
      const a = all[i]; if (!pass(a) || !inTab(a, st.tab)) continue;
      let n = nodes.get(a.id); if (!n) { n = build(a, false); nodes.set(a.id, n); }
      list.append(n); k++;
    }
    list.scrollTop = 0; toggleEmpty(); refit();
  }
  function add(a, live) {
    if (seen.has(a.id)) return; seen.add(a.id);
    if (a.chain && !st.chains.has(a.chain)) { st.chains.add(a.chain); renderChips(); save(); }
    all.push(a);
    const ok = pass(a), n = build(a, live && ok && inTab(a, st.tab));
    nodes.set(a.id, n);
    renderTabs();
    if (!ok || !inTab(a, st.tab)) return;
    list.querySelector('.empty')?.remove();
    const before = list.scrollHeight, shifted = list.scrollTop > 4;
    list.prepend(n);
    if (shifted) list.scrollTop += list.scrollHeight - before;     // a reader scrolled down keeps their place
    const rs = rows(); for (let i = rs.length - 1; i >= MAX; i--) { nodes.delete(+rs[i].dataset.id); fitQ.delete(rs[i]); rs[i].remove(); }
    if (n._fit) fitQ.add(n);
    frame();   // the scrollbar's size follows the list, without showing it
    if (live) { ping(typeKey(a.type)); desktop(a); }
  }
  setInterval(() => list.querySelectorAll('.ago').forEach((x) => { x.textContent = ago(+x.dataset.ts); }), 1000);

  /* ---------- stream ---------- */
  const dot = $('dot');
  // The plan, worded exactly as /manage words it, from the same data (it used to say "live · full", a feed-only label).
  function leftText(ms) {   // = timeLeftText in manage.html
    const mins = Math.max(0, Math.floor(ms / 60000)), d = Math.floor(mins / 1440), h = Math.floor((mins % 1440) / 60), m = mins % 60;
    if (d >= 2) return d + ' days left';
    if (d === 1) return '1 day ' + h + 'h left';
    return h > 0 ? h + 'h ' + m + 'm left' : m + 'm left';
  }
  function shortLeft(ms) {   // = shortLeft in manage.html: the same, for a narrow bar
    const mins = Math.max(0, Math.floor(ms / 60000)), d = Math.floor(mins / 1440), h = Math.floor(mins / 60);
    return d >= 1 ? d + 'd' : h >= 1 ? h + 'h' : mins + 'm';
  }
  const showPlan = (p) => { const e = $('tier'); e.className = 'tier ' + p.cls; e.replaceChildren(el('span', 'pl-l', p.text), el('span', 'pl-s', p.short)); };
  let planShown = null;   // kept across stream reconnects, so the badge does not flash back to a placeholder
  async function loadPlan() {
    try {
      const s = await fetch('/api/manage/subscription', { credentials: 'same-origin' }).then((r) => (r.ok ? r.json() : null));
      if (!s || st.tier === 'demo') return;
      const now = Date.now(); let text, short, cls;
      if (s.lifetime) { text = short = 'Lifetime'; cls = 'full'; }
      else if (s.activeUntil && Date.parse(s.activeUntil) > now) { const left = Date.parse(s.activeUntil) - now; text = 'Full access · ' + leftText(left); short = shortLeft(left) + ' left'; cls = left <= 3 * 864e5 ? 'soon' : 'full'; }
      else if (s.trialEndsAt && Date.parse(s.trialEndsAt) > now) { const left = Date.parse(s.trialEndsAt) - now; text = 'Free trial · ' + leftText(left); short = 'Trial · ' + shortLeft(left); cls = 'soon'; }
      else { text = s.trialEndsAt ? 'Trial ended' : 'No active plan'; short = s.trialEndsAt ? 'Trial ended' : 'No plan'; cls = 'none'; }
      planShown = { text, short, cls };
      showPlan(planShown);
    } catch {}
  }
  function setTier(t, delay) {
    st.tier = t; window.__delay = delay || 90;
    if (t !== 'demo' && planShown) showPlan(planShown);
    else { const w = t === 'demo' ? 'demo' : t === 'full' ? 'full access' : 'free'; showPlan({ text: w, short: w, cls: t }); }
    if (t !== 'demo') loadPlan();   // then the exact words /manage shows: Lifetime, Full access · 17 days left, Free trial · ...
    const b = $('banner');
    if (t === 'demo') {
      b.hidden = false;
      b.replaceChildren(document.createTextNode('Live preview: the coin name, the contract and the size of buys and sells are hidden. '), Object.assign(el('a', null, 'Log in through Telegram'), { href: '/manage' }), document.createTextNode(' (send /manage to the bot) to see everything.'));
    } else if (t === 'free') {
      b.hidden = false;
      b.replaceChildren(document.createTextNode('Live, but the coin name, the contract and the size of buys and sells stay hidden on the free plan. '), Object.assign(el('a', null, 'Upgrade: /subscribe in the bot'), { href: '/manage' }));
    } else b.hidden = true;
    toggleEmpty();
  }
  let es, backoff = 1000, backlogBuf = [], backlogTimer;
  function flushBacklog() {
    if (!backlogBuf.length) return;
    const b = backlogBuf; backlogBuf = [];
    b.forEach((a) => add(a, false));
  }
  function connect() {
    es = new EventSource('/api/feed/stream');
    es.addEventListener('hello', (ev) => { const h = JSON.parse(ev.data); track('tier:' + h.tier); setTier(h.tier, h.delaySec); dot.className = 'dot live'; dot.title = 'live'; backoff = 1000; });
    es.addEventListener('backlog', (ev) => { backlogBuf.push(JSON.parse(ev.data)); clearTimeout(backlogTimer); backlogTimer = setTimeout(flushBacklog, 60); });
    es.addEventListener('alert', (ev) => { flushBacklog(); add(JSON.parse(ev.data), true); });
    es.onerror = () => { dot.className = 'dot retry'; dot.title = 'reconnecting'; es.close(); setTimeout(connect, backoff); backoff = Math.min(backoff * 2, 15000); };
  }

  /* ---------- UI wiring ---------- */
  function chip(parent, label, on, fn) {
    const b = el('button', 'chip' + (on ? ' on' : ''), label);
    b.addEventListener('click', () => { track('filter:' + parent.id); fn(); renderChips(); save(); renderTabs(); rerender(); });
    parent.append(b);
  }
  const toggle = (set, v) => set.has(v) ? set.delete(v) : set.add(v);
  function renderChips() {
    const p = $('fPlat'), c = $('fChain');
    p.replaceChildren(); c.replaceChildren();
    for (const [k, n] of [['fomo', 'FOMO'], ['pump', 'Pump'], ['lock', 'Locks']]) chip(p, n, !st.offPlat.has(k), () => toggle(st.offPlat, k));
    for (const k of [...st.chains].sort()) chip(c, k, !st.offChain.has(k), () => toggle(st.offChain, k));
    if (!st.chains.size) c.append(el('span', 'sub', 'appear as alerts arrive'));
  }
  function renderMuted() {
    const m = $('muted'); m.replaceChildren();
    if (!st.muted.size) m.append(el('span', 'sub', 'none'));
    for (const t of st.muted) { const b = el('button', 'chip on', t + ' ✕'); b.addEventListener('click', () => { st.muted.delete(t); save(); renderMuted(); renderTabs(); rerender(); }); m.append(b); }
  }
  // One button folds every call / thesis to its 2-line preview, or shows them all whole again (the default).
  const FOLD_ICON = '<path d="m7 20 5-5 5 5"/><path d="m7 4 5 5 5-5"/>', UNFOLD_ICON = '<path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/>';
  const syncFold = () => {
    document.body.classList.toggle('fold', st.fold);
    const b = $('bFold'); b.querySelector('svg').innerHTML = st.fold ? UNFOLD_ICON : FOLD_ICON;
    b.title = st.fold ? 'Show calls, theses and locks in full' : 'Fold calls, theses and locks'; b.setAttribute('aria-label', b.title); b.setAttribute('aria-pressed', String(st.fold));
  };
  const syncButtons = () => { $('bSound').classList.toggle('on', st.sound); $('bNotif').classList.toggle('on', st.notif); syncFold(); };
  $('bFold').addEventListener('click', () => {
    st.fold = !st.fold; track('fold:' + (st.fold ? 'on' : 'off')); save(); syncFold();
    for (const r of nodes.values()) if (r._fit || r._lock) setOpen(r, !st.fold);   // every call / thesis / lock, also any opened or folded on its own
    frame();
  });

  // Pop out. A browser window will not go much narrower than ~500px; a popup window (no tabs, no toolbar) will, so the feed
  // can sit in a thin strip beside the trading terminal. Offered on computers, and not inside the popup itself.
  const POP = 'gcfeed-pop';
  if (window.name !== POP && matchMedia('(pointer: fine)').matches) $('bPop').hidden = false;
  $('bPop').addEventListener('click', () => {
    track('popout', true);
    const w = 380, h = Math.min(screen.availHeight || 900, 1200), left = (screen.availLeft || 0) + (screen.availWidth || w) - w, top = screen.availTop || 0;
    window.open('/feed', POP, 'popup=yes,width=' + w + ',height=' + h + ',left=' + left + ',top=' + top)?.focus();
  });
  $('bFilter').addEventListener('click', () => { track('filters:open'); $('filters').classList.toggle('open'); $('bFilter').classList.toggle('on'); });
  $('bSound').addEventListener('click', () => { st.sound = !st.sound; track('sound:' + (st.sound ? 'on' : 'off')); if (st.sound) ping('buy'); save(); syncButtons(); });
  $('bNotif').addEventListener('click', async () => {
    if (!('Notification' in window)) return;
    if (!st.notif) { if (Notification.permission !== 'granted') await Notification.requestPermission(); st.notif = Notification.permission === 'granted'; }
    else st.notif = false;
    track('notify:' + (st.notif ? 'on' : 'off')); save(); syncButtons();
  });
  $('term').value = st.term;
  $('term').addEventListener('change', (e) => { st.term = e.target.value; track('terminal:' + st.term); save(); });
  $('minMc').value = st.minMc || ''; $('minUsd').value = st.minUsd || '';
  $('minMc').addEventListener('input', (e) => { track('filter:mc'); st.minMc = +e.target.value || 0; save(); renderTabs(); rerender(); });
  $('minUsd').addEventListener('input', (e) => { track('filter:usd'); st.minUsd = +e.target.value || 0; save(); renderTabs(); rerender(); });

  renderChips(); renderMuted(); syncButtons(); renderTabs(); setTier('demo'); toggleEmpty();
  connect();
})();
</script>
<script src="/t.js" defer></script>
</body>
